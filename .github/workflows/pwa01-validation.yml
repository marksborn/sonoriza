name: PWA-01 validation

on:
  push:
    branches:
      - agent/pwa-01-installable-app-85
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza?schema=public
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: pwa01-ci-secret-not-for-production
      SONORIZA_ALLOWED_EMAILS: owner@example.com
      AUTH_SPOTIFY_ID: test
      AUTH_SPOTIFY_SECRET: test
      AUTH_GOOGLE_ID: test
      AUTH_GOOGLE_SECRET: test
      CRON_SECRET: pwa01-ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: PWA-01 contract
        run: npx tsx --test src/services/pwa-contract.test.ts
      - run: npm run typecheck
      - run: npm run build
      - name: PWA-01 HTTP smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          npm start >/tmp/sonoriza-pwa.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/manifest.webmanifest >/tmp/manifest.webmanifest; then
              break
            fi
            sleep 1
          done

          node - <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync('/tmp/manifest.webmanifest', 'utf8'))
          if (manifest.display !== 'standalone') throw new Error('manifest display')
          if (manifest.start_url !== '/dashboard') throw new Error('manifest start_url')
          const icons = manifest.icons ?? []
          if (!icons.some((icon) => icon.sizes === '192x192')) throw new Error('missing 192 icon')
          if (!icons.some((icon) => icon.sizes === '512x512')) throw new Error('missing 512 icon')
          if (!icons.some((icon) => String(icon.purpose ?? '').includes('maskable'))) throw new Error('missing maskable icon')
          NODE

          curl -fsSI http://127.0.0.1:3000/sw.js >/tmp/sw.headers
          grep -Eqi '^content-type: application/javascript' /tmp/sw.headers
          grep -Eqi '^cache-control: no-cache, no-store, must-revalidate' /tmp/sw.headers
          grep -Eqi '^service-worker-allowed: /' /tmp/sw.headers

          curl -fsS http://127.0.0.1:3000/pwa-icon/180 -o /tmp/icon-180.png
          curl -fsS http://127.0.0.1:3000/pwa-icon/192 -o /tmp/icon-192.png
          curl -fsS http://127.0.0.1:3000/pwa-icon/512 -o /tmp/icon-512.png
          file /tmp/icon-180.png | grep -F 'PNG image data, 180 x 180'
          file /tmp/icon-192.png | grep -F 'PNG image data, 192 x 192'
          file /tmp/icon-512.png | grep -F 'PNG image data, 512 x 512'

          INVALID_CODE="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/pwa-icon/123)"
          test "$INVALID_CODE" = "404"
