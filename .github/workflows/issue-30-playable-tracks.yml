          import type { Candidate } from "@/services/playlist-planner";

          export type SpotifyMusicTrackLike = {
            uri?: string | null;
            name?: string | null;
            duration_ms?: number | null;
            type?: string | null;
            is_local?: boolean;
            is_playable?: boolean;
            restrictions?: { reason?: string | null } | null;
            artists?: Array<{ name?: string | null }> | null;
          };

          export type PlayableMusicCandidateResult = {
            candidate: Candidate | null;
            unavailable: boolean;
            restrictionReason: string | null;
          };

          /**
           * Converts a Spotify track into a planner candidate only when Spotify
           * has not explicitly marked it unavailable for the authenticated
           * user's playback context. Missing is_playable alone is not treated
           * as a failure: we do not invent unavailability when Spotify did not
           * provide an explicit negative signal.
           */
          export function readPlayableMusicCandidate(
            track: SpotifyMusicTrackLike | null | undefined,
          ): PlayableMusicCandidateResult {
            if (!track || track.type !== "track" || track.is_local) {
              return { candidate: null, unavailable: false, restrictionReason: null };
            }

            const restrictionReason =
              typeof track.restrictions?.reason === "string" &&
              track.restrictions.reason.trim()
                ? track.restrictions.reason.trim()
                : null;
            const hasRestriction = track.restrictions != null;

            if (track.is_playable === false || hasRestriction) {
              return { candidate: null, unavailable: true, restrictionReason };
            }

            if (
              typeof track.uri !== "string" ||
              !track.uri ||
              typeof track.name !== "string" ||
              !track.name ||
              typeof track.duration_ms !== "number" ||
              !Number.isFinite(track.duration_ms) ||
              track.duration_ms <= 0
            ) {
              return { candidate: null, unavailable: false, restrictionReason: null };
            }

            const artistNames = (track.artists ?? [])
              .flatMap((artist) =>
                typeof artist.name === "string" && artist.name.trim()
                  ? [artist.name.trim()]
                  : [],
              )
              .join(", ");

            return {
              candidate: {
                uri: track.uri,
                type: "MUSIC",
                title: track.name,
                ...(artistNames ? { subtitle: artistNames } : {}),
                durationMs: track.duration_ms,
              },
              unavailable: false,
              restrictionReason: null,
            };
          }
          EOF

          cat > src/services/spotify/source-cache.ts <<'EOF'
          import type { Candidate } from "@/services/playlist-planner";

          const MUSIC_SOURCE_CACHE_VERSION = 2;

          type CachedMusicCandidate = {
            uri: string;
            title: string;
            subtitle: string | null;
            durationMs: number;
          };

          type MusicSourceCachePayload = {
            version: typeof MUSIC_SOURCE_CACHE_VERSION;
            unavailableTrackCount: number;
            candidates: CachedMusicCandidate[];
          };

          export function encodeMusicSourceCache(
            candidates: Candidate[],
            unavailableTrackCount = 0,
          ): MusicSourceCachePayload {
            return {
              version: MUSIC_SOURCE_CACHE_VERSION,
              unavailableTrackCount: Math.max(0, Math.trunc(unavailableTrackCount)),
              candidates: candidates.map((candidate) => ({
                uri: candidate.uri,
                title: candidate.title,
                subtitle: candidate.subtitle ?? null,
                durationMs: candidate.durationMs,
              })),
            };
          }

          export function decodeMusicSourceCache(value: unknown): Candidate[] | null {
            return decodePayload(value)?.candidates ?? null;
          }

          export function decodeMusicSourceCacheUnavailableTrackCount(
            value: unknown,
          ): number | null {
            return decodePayload(value)?.unavailableTrackCount ?? null;
          }

          function decodePayload(
            value: unknown,
          ): { candidates: Candidate[]; unavailableTrackCount: number } | null {
            if (!value || typeof value !== "object" || Array.isArray(value)) return null;
            const payload = value as Record<string, unknown>;
            if (payload.version !== MUSIC_SOURCE_CACHE_VERSION) return null;
            if (!Array.isArray(payload.candidates)) return null;
            if (
              typeof payload.unavailableTrackCount !== "number" ||
              !Number.isFinite(payload.unavailableTrackCount) ||
              payload.unavailableTrackCount < 0
            ) {
              return null;
            }

            const candidates: Candidate[] = [];
            for (const item of payload.candidates) {
              if (!item || typeof item !== "object" || Array.isArray(item)) return null;
              const candidate = item as Record<string, unknown>;
              if (
                typeof candidate.uri !== "string" ||
                typeof candidate.title !== "string" ||
                typeof candidate.durationMs !== "number" ||
                !Number.isFinite(candidate.durationMs) ||
                candidate.durationMs < 0 ||
                !(
                  candidate.subtitle === null ||
                  candidate.subtitle === undefined ||
                  typeof candidate.subtitle === "string"
                )
              ) {
                return null;
              }

              candidates.push({
                uri: candidate.uri,
                type: "MUSIC",
                title: candidate.title,
                ...(typeof candidate.subtitle === "string"
                  ? { subtitle: candidate.subtitle }
                  : {}),
                durationMs: candidate.durationMs,
              });
            }

            return {
              candidates,
              unavailableTrackCount: Math.trunc(payload.unavailableTrackCount),
            };
          }
          EOF

