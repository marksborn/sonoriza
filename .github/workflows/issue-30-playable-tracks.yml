name: Issue 30 playable Spotify tracks

on:
  push:
    branches:
      - agent/spotify-playable-tracks-30

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sonoriza_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sonoriza_test?schema=public
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: issue-30-validation-only-secret
      AUTH_SPOTIFY_ID: validation-only
      AUTH_SPOTIFY_SECRET: validation-only
      AUTH_GOOGLE_ID: validation-only
      AUTH_GOOGLE_SECRET: validation-only
      CRON_SECRET: validation-only
