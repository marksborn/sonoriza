name: MUSIC-REPEAT Last.fm Validation

on:
  pull_request:
    paths:
      - "src/jobs/music-repeat-runtime.ts"
      - "src/jobs/music-repeat-lastfm-factual.test.ts"
      - "src/services/music-preference/lastfm-coverage.ts"
      - "src/services/music-preference/lastfm-coverage-reader.ts"
      - "src/services/lastfm/**"
      - "src/services/spotify/recently-played.ts"
      - ".env.example"
      - ".github/workflows/music-repeat-lastfm-validation.yml"
  push:
    branches:
      - "fix/lastfm-repeat-cooldown"
    paths:
      - "src/jobs/music-repeat-runtime.ts"
      - "src/jobs/music-repeat-lastfm-factual.test.ts"
      - "src/services/music-preference/lastfm-coverage.ts"
      - "src/services/music-preference/lastfm-coverage-reader.ts"
      - "src/services/lastfm/**"
      - "src/services/spotify/recently-played.ts"
      - ".env.example"
      - ".github/workflows/music-repeat-lastfm-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Factual Last.fm cooldown tests
        run: npx tsx --test src/jobs/music-repeat-lastfm-factual.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
