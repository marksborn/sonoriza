name: MUSIC-IDENTITY-01 Gate 3B validation

on:
  pull_request:
    paths:
      - "src/services/music-identity/strong-identifier-enrichment-shadow.ts"
      - "src/services/music-identity/strong-identifier-enrichment-shadow.test.ts"
      - "src/services/music-identity/strong-identifier-enrichment-shadow.integration.test.ts"
      - "src/services/music-identity/shadow-resolver-report.ts"
      - "src/services/music-identity/contracts.ts"
      - "src/services/spotify/catalog-search.ts"
      - "src/services/spotify/source-cache.ts"
      - "src/services/target-source-scope.ts"
      - "scripts/report-music-identity-strong-id-shadow.ts"
      - ".github/workflows/music-identity-01-gate3b-validation.yml"
  push:
    branches:
      - main
    paths:
      - "src/services/music-identity/strong-identifier-enrichment-shadow.ts"
      - "src/services/music-identity/strong-identifier-enrichment-shadow.test.ts"
      - "src/services/music-identity/strong-identifier-enrichment-shadow.integration.test.ts"
      - "src/services/music-identity/shadow-resolver-report.ts"
      - "src/services/music-identity/contracts.ts"
      - "src/services/spotify/catalog-search.ts"
      - "src/services/spotify/source-cache.ts"
      - "src/services/target-source-scope.ts"
      - "scripts/report-music-identity-strong-id-shadow.ts"
      - ".github/workflows/music-identity-01-gate3b-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_music_identity_gate3b
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_music_identity_gate3b"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: http://postgres:postgres@127.0.0.1:5432/sonoriza_music_identity_gate3b?schema=public
      NEXTAUTH_SECRET: music-identity-gate3b-ci-secret
      AUTH_SECRET: music-identity-gate3b-ci-secret
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
      MUSIC_IDENTITY_DB_TEST: "1"
