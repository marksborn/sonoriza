name: MUSIC-IDENTITY-01 Gate 5C MusicBrainz shadow

on:
  pull_request:
    paths:
      - "src/services/music-identity/musicbrainz-isrc-mbid-shadow.ts"
      - "src/services/music-identity/musicbrainz-isrc-mbid-shadow-client.ts"
      - "src/services/music-identity/musicbrainz-isrc-mbid-shadow-report.ts"
      - "src/services/music-identity/musicbrainz-isrc-mbid-shadow-selection.ts"
      - "src/services/music-identity/musicbrainz-isrc-mbid-shadow-selection.test.ts"
      - "src/services/music-identity/musicbrainz-isrc-mbid-shadow.test.ts"
      - "scripts/report-music-identity-gate5c-musicbrainz-shadow.ts"
      - "docs/MUSIC-IDENTITY-01-GATE5C-MUSICBRAINZ-ISRC-SHADOW.md"
      - ".github/workflows/music-identity-01-gate5c-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Gate 5C conservative decision and provider failure contracts
        run: npx tsx --test src/services/music-identity/musicbrainz-isrc-mbid-shadow.test.ts
      - name: Gate 5D.7 strict canonical comparator and factual cooldown regressions
        run: >-
          npx tsx --test
          src/services/music-identity/shadow-resolver-report.test.ts
          src/services/music-identity/canonical-factual-mbid-linkage-shadow.test.ts
          src/jobs/music-repeat-lastfm-factual.test.ts
          src/services/spotify/recently-played.test.ts
          src/services/lastfm/retry.test.ts
          src/services/keep-filled-core.test.ts
      - name: Gate 5D.3 historical run selection guardrails
        run: npx tsx --test src/services/music-identity/musicbrainz-isrc-mbid-shadow-selection.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
