name: NOTIFY-01 validation

on:
  push:
    branches:
      - agent/notify-01-web-push-87

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_notify01
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_notify01?schema=public
      AUTH_URL: http://127.0.0.1:3000
      AUTH_SECRET: notify01-ci-secret
      AUTH_SPOTIFY_ID: notify01-ci-spotify-id
      AUTH_SPOTIFY_SECRET: notify01-ci-spotify-secret
      AUTH_GOOGLE_ID: notify01-ci-google-id
      AUTH_GOOGLE_SECRET: notify01-ci-google-secret
      CRON_SECRET: notify01-ci-cron-secret
      SONORIZA_ALLOWED_EMAILS: tester@example.com
      WEB_PUSH_VAPID_PUBLIC_KEY: ci-public-key
      WEB_PUSH_VAPID_PRIVATE_KEY: ci-private-key
      WEB_PUSH_VAPID_SUBJECT: mailto:ci@example.com

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notify-01-web-push-87
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Materialize schema and integration patch
        if: github.actor != 'github-actions[bot]'
        run: python3 scripts/notify01-materialize.py

      - name: Refresh lockfile
        if: github.actor != 'github-actions[bot]'
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Format Prisma schema
        if: github.actor != 'github-actions[bot]'
        run: npx prisma format

      - name: Commit materialized branch state
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma package-lock.json src scripts/notify01-materialize.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: integrate NOTIFY-01 operational push #87"
            git push origin HEAD:agent/notify-01-web-push-87
          fi

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to isolated PostgreSQL
        run: npx prisma migrate deploy

      - name: NOTIFY-01 and PWA contracts
        run: npx tsx --test src/services/notifications/*.test.ts src/services/pwa-contract.test.ts src/services/target-schedule.test.ts

      - name: Incremental generation regression
        run: npx tsx --test src/jobs/generate-playlists-incremental.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
