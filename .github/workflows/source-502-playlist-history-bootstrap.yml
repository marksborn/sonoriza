name: Bootstrap source 502 playlist history

on:
  push:
    branches:
      - agent/source-502-playlist-history
    paths:
      - .github/workflows/source-502-playlist-history-bootstrap.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_source502_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_source502_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_source502_gate?schema=public
      NEXTAUTH_SECRET: source-502-gate-secret
      AUTH_SECRET: source-502-gate-secret
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Apply deterministic patch
        run: python3 .github/scripts/source-502-playlist-history-bootstrap.py
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run test:incremental
      - run: npx tsx --test src/services/generation-run-diagnostics.test.ts
      - run: npm run typecheck
      - run: npm run build
      - name: Commit validated implementation
        run: |
          rm .github/workflows/source-502-playlist-history-bootstrap.yml
          rm .github/scripts/source-502-playlist-history-bootstrap.py
          git config user.name "Sonoriza CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: degrade isolated Spotify 502 and expose run history"
          git push origin HEAD:agent/source-502-playlist-history
