name: LIKED-01 validation

on:
  pull_request:
    paths:
      - "prisma/**"
      - "src/services/music-preference/**"
      - "src/services/music-discovery/**"
      - "src/jobs/discovery-runtime.ts"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/liked-01-validation.yml"
  push:
    branches:
      - main
    paths:
      - "prisma/**"
      - "src/services/music-preference/**"
      - "src/services/music-discovery/**"
      - "src/jobs/discovery-runtime.ts"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/liked-01-validation.yml"

permissions:
  contents: write

jobs:
  gate6c_patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/liked-01-gate6c'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/liked-01-gate6c
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Apply Gate 6C integration once
        run: python scripts/patch-liked-gate6c.py
      - name: Commit product integration
        run: |
          git config user.name "marksborn"
          git config user.email "1066412+marksborn@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire LIKED Gate 6C controlled runtime pilot"
          git push origin HEAD:feat/liked-01-gate6c
