name: LIKED-01 validation

on:
  pull_request:
    paths:
      - "prisma/**"
      - "src/services/music-preference/**"
      - "scripts/report-liked-track-affinity.ts"
      - "scripts/report-liked-artist-similarity.ts"
      - "scripts/report-liked-shadow-discovery.ts"
      - "scripts/report-liked-artist-similarity-backfill.ts"
      - "scripts/report-liked-discovery-expansion-shadow.ts"
      - "package.json"
      - ".github/workflows/liked-01-validation.yml"
  push:
    branches:
      - main
    paths:
      - "prisma/**"
      - "src/services/music-preference/**"
      - "scripts/report-liked-track-affinity.ts"
      - "scripts/report-liked-artist-similarity.ts"
      - "scripts/report-liked-shadow-discovery.ts"
      - "scripts/report-liked-artist-similarity-backfill.ts"
      - "scripts/report-liked-discovery-expansion-shadow.ts"
      - "package.json"
      - ".github/workflows/liked-01-validation.yml"

jobs:
  format-canonical-call:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/liked-01-gate6a'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/liked-01-gate6a
      - name: Normalize resolved candidate call formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/services/music-preference/liked-discovery-expansion-shadow.ts')
          text = path.read_text()
          old = '''      resolvedCandidates.push(
            materializeResolvedExpansionCandidate(candidate, resolution),
          );'''
          # The previous automation produced a semantically valid but under-indented
          # variant because YAML block indentation was stripped from the replacement.
          under_indented = '''      resolvedCandidates.push(
  materializeResolvedExpansionCandidate(candidate, resolution),
);'''
          if under_indented in text:
              text = text.replace(under_indented, old, 1)
          elif old in text:
              raise SystemExit('already normalized')
          else:
              raise SystemExit('canonical call anchor not found')
          path.write_text(text)
          PY
          git config user.name "Marcos Nascimento"
          git config user.email "nascimento@itscontrol.com.br"
          git add src/services/music-preference/liked-discovery-expansion-shadow.ts
          git commit -m "style: normalize LIKED resolved candidate call"
          git push origin HEAD:feat/liked-01-gate6a

  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sonoriza_test?schema=public
      AUTH_SECRET: test-secret-for-ci-only
      AUTH_URL: http://localhost:3000
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run test:music-preference
      - run: npm run typecheck
      - run: npm run build
