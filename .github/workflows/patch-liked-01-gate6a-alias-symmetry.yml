name: Patch LIKED-01 Gate 6A alias symmetry

on:
  push:
    branches:
      - feat/liked-01-gate6a
    paths:
      - ".github/workflows/patch-liked-01-gate6a-alias-symmetry.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/liked-01-gate6a
          fetch-depth: 0
      - name: Apply symmetric controlled-article identity guards
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one marker, got {count}")
              return text.replace(old, new, 1)

          service = Path("src/services/music-preference/liked-discovery-expansion-shadow.ts")
          text = service.read_text()

          text = replace_once(
              text,
              '''      const resolvedArtistName = normalized(resolution.spotifyArtist.name);\n      // Reapply baseline artist exclusion after Spotify canonicalizes aliases.\n      // This prevents "The X" from entering when current discovery already has "X".\n      if (representedArtistNames.has(resolvedArtistName)) {''',
              '''      const resolvedArtistName = normalized(resolution.spotifyArtist.name);\n      // Reapply baseline artist exclusion after Spotify canonicalizes aliases.\n      // Controlled leading-article equivalence is symmetric: both X -> The X\n      // and The X -> X must remain the same discovery identity.\n      if (hasEquivalentArtistName(representedArtistNames, resolvedArtistName)) {''',
              "represented alias guard",
          )

          text = replace_once(
              text,
              '''export function isResolvedHistoricalArtist(\n  spotifyArtistId: string,\n  normalizedSpotifyArtistName: string,\n  historicalSpotifyArtistIds: ReadonlySet<string>,\n  historicalNormalizedArtistNames: ReadonlySet<string>,\n): boolean {\n  return (\n    historicalSpotifyArtistIds.has(spotifyArtistId) ||\n    historicalNormalizedArtistNames.has(normalizedSpotifyArtistName)\n  );\n}\n\nfunction betterSeed(''',
              '''export function isResolvedHistoricalArtist(\n  spotifyArtistId: string,\n  normalizedSpotifyArtistName: string,\n  historicalSpotifyArtistIds: ReadonlySet<string>,\n  historicalNormalizedArtistNames: ReadonlySet<string>,\n): boolean {\n  return (\n    historicalSpotifyArtistIds.has(spotifyArtistId) ||\n    hasEquivalentArtistName(\n      historicalNormalizedArtistNames,\n      normalizedSpotifyArtistName,\n    )\n  );\n}\n\nexport function hasEquivalentArtistName(\n  normalizedArtistNames: ReadonlySet<string>,\n  normalizedArtistName: string,\n): boolean {\n  for (const form of controlledArtistIdentityForms(normalizedArtistName)) {\n    if (normalizedArtistNames.has(form)) return true;\n  }\n  return false;\n}\n\nexport function controlledArtistIdentityForms(value: string): string[] {\n  const clean = normalized(value);\n  if (!clean) return [];\n  const forms = new Set<string>([clean]);\n  if (/^the\\s+/.test(clean)) {\n    const alias = clean.replace(/^the\\s+/, "").trim();\n    if (alias.length >= 2) forms.add(alias);\n  } else if (clean.length >= 2) {\n    forms.add(`the ${clean}`);\n  }\n  return [...forms];\n}\n\nfunction betterSeed(''',
              "symmetric alias helper",
          )
          service.write_text(text)

          tests_path = Path("src/services/music-preference/liked-discovery-expansion-shadow.test.ts")
          tests = tests_path.read_text()
          tests = replace_once(
              tests,
              '''  buildLikedExpansionHistoryCounts,\n  isResolvedDirectAffinityArtist,\n  isResolvedHistoricalArtist,''',
              '''  buildLikedExpansionHistoryCounts,\n  controlledArtistIdentityForms,\n  hasEquivalentArtistName,\n  isResolvedDirectAffinityArtist,\n  isResolvedHistoricalArtist,''',
              "test imports",
          )

          marker = '''test("resolved canonical artist name re-applies represented baseline exclusion", () => {'''
          replacement = '''test("controlled leading-article aliases compare symmetrically after resolution", () => {\n  assert.deepEqual(\n    new Set(controlledArtistIdentityForms("The X")),\n    new Set(["the x", "x"]),\n  );\n  assert.deepEqual(\n    new Set(controlledArtistIdentityForms("X")),\n    new Set(["x", "the x"]),\n  );\n  assert.equal(hasEquivalentArtistName(new Set(["x"]), "the x"), true);\n  assert.equal(hasEquivalentArtistName(new Set(["the x"]), "x"), true);\n  assert.equal(hasEquivalentArtistName(new Set(["y"]), "x"), false);\n});\n\n''' + marker
          tests = replace_once(tests, marker, replacement, "alias regression insertion")

          old_history_assert = '''  assert.equal(\n    isResolvedHistoricalArtist(\n      "spotify-missing-id",\n      "known canonical name",\n      historicalIds,\n      historicalNames,\n    ),\n    true,\n  );'''
          new_history_assert = old_history_assert + '''\n  assert.equal(\n    isResolvedHistoricalArtist(\n      "spotify-missing-id",\n      "the known canonical name",\n      historicalIds,\n      historicalNames,\n    ),\n    true,\n  );'''
          tests = replace_once(
              tests,
              old_history_assert,
              new_history_assert,
              "history alias regression",
          )
          tests_path.write_text(tests)

      - name: Commit patch
        run: |
          git config user.name "Marcos Nascimento"
          git config user.email "nascimento@itscontrol.com.br"
          git add src/services/music-preference/liked-discovery-expansion-shadow.ts \
                  src/services/music-preference/liked-discovery-expansion-shadow.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: compare LIKED artist aliases symmetrically"
          git push origin HEAD:feat/liked-01-gate6a
