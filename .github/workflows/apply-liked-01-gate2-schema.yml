name: Apply LIKED-01 Gate 2 schema

on:
  push:
    branches:
      - feat/liked-01-gate2
    paths:
      - .github/workflows/apply-liked-01-gate2-schema.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/liked-01-gate2
      - name: Apply deterministic Prisma schema changes
        run: python3 -c 'from pathlib import Path; import base64; p=Path("prisma/schema.prisma"); t=p.read_text(); old="  musicPreferenceSignals           MusicPreferenceSignal[]\n  albumRecommendationMemories      AlbumRecommendationMemory[]\n"; new="  musicPreferenceSignals           MusicPreferenceSignal[]\n  likedTrackPreferences             LikedTrackPreference[]\n  artistAffinityStates              ArtistAffinityState[]\n  albumRecommendationMemories      AlbumRecommendationMemory[]\n"; assert t.count(old)==1, "User relation anchor mismatch"; t=t.replace(old,new,1); frag=base64.b64decode("").decode(); idx=t.index("// MUSIC-05 "); start=t.rfind("// ---------------------------------------------------------------------------",0,idx); assert start>=0, "MUSIC-05 section start not found"; t=t[:start]+frag+t[start:]; p.write_text(t)'
      - name: Commit schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "feat: wire LIKED-01 Gate 2 Prisma schema"
          git push origin HEAD:feat/liked-01-gate2
