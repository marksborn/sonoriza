name: Apply LIKED-01 Gate 2 schema

on:
  push:
    branches:
      - feat/liked-01-gate2
    paths:
      - .github/workflows/apply-liked-01-gate2-schema.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/liked-01-gate2
      - name: Apply deterministic Prisma schema changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('prisma/schema.prisma')
          text = path.read_text()

          user_old = '  musicPreferenceSignals           MusicPreferenceSignal[]\n  albumRecommendationMemories      AlbumRecommendationMemory[]\n'
          user_new = '  musicPreferenceSignals           MusicPreferenceSignal[]\n  likedTrackPreferences             LikedTrackPreference[]\n  artistAffinityStates              ArtistAffinityState[]\n  albumRecommendationMemories      AlbumRecommendationMemory[]\n'
          if text.count(user_old) != 1:
              raise SystemExit('User relation anchor not found exactly once')
          text = text.replace(user_old, user_new, 1)

          anchor = '''// ---------------------------------------------------------------------------
// MUSIC-05 — inferred skip preference signals.
'''
          if text.count(anchor) != 1:
              raise SystemExit('MUSIC-05 anchor not found exactly once')

          liked = '''// ---------------------------------------------------------------------------
// LIKED-01 — canonical explicit liked-track state and artist affinity.
//
// Gate 2 is shadow-only: planner/discovery do not consume these models yet.
// A liked track is durable explicit preference evidence. Artist affinity is
// derived from the canonical primary artist and remains independently auditable
// so an unlike can remove one supporting track without erasing other evidence.
// ---------------------------------------------------------------------------

enum LikedTrackPreferenceProvenance {
  LIKED_TRACK_BACKFILL
  LIKED_TRACK_SYNC
}

enum LikedTrackAvailability {
  AVAILABLE
  UNAVAILABLE
  INVALID
}

enum ArtistAffinityEvidenceType {
  LIKED_TRACK
}

model LikedTrackPreference {
  id                String                         @id @default(cuid())
  userId            String
  spotifyTrackId    String
  spotifyUri        String?
  trackName         String?
  primaryArtistId   String?
  primaryArtistName String?
  albumId           String?
  albumName         String?
  addedAt           DateTime?
  isLiked           Boolean                        @default(true)
  availability      LikedTrackAvailability
  firstProvenance   LikedTrackPreferenceProvenance
  lastProvenance    LikedTrackPreferenceProvenance
  firstObservedAt   DateTime                       @default(now())
  lastObservedAt    DateTime
  unlikedAt         DateTime?
  createdAt         DateTime                       @default(now())
  updatedAt         DateTime                       @updatedAt

  user             User                     @relation(fields: [userId], references: [id], onDelete: Cascade)
  affinityEvidence ArtistAffinityEvidence[]

  @@unique([userId, spotifyTrackId])
  @@index([userId, isLiked])
  @@index([userId, primaryArtistId, isLiked])
}

model ArtistAffinityEvidence {
  id                String                         @id @default(cuid())
  userId            String
  spotifyTrackId    String
  spotifyArtistId   String
  artistName        String?
  type              ArtistAffinityEvidenceType     @default(LIKED_TRACK)
  active            Boolean                        @default(true)
  firstProvenance   LikedTrackPreferenceProvenance
  lastProvenance    LikedTrackPreferenceProvenance
  firstObservedAt   DateTime                       @default(now())
  lastChangedAt     DateTime
  removedAt         DateTime?
  createdAt         DateTime                       @default(now())
  updatedAt         DateTime                       @updatedAt

  likedTrack LikedTrackPreference @relation(fields: [userId, spotifyTrackId], references: [userId, spotifyTrackId], onDelete: Cascade)

  @@unique([userId, type, spotifyTrackId, spotifyArtistId])
  @@index([userId, spotifyArtistId, active])
  @@index([userId, spotifyTrackId, active])
}

model ArtistAffinityState {
  id                String   @id @default(cuid())
  userId            String
  spotifyArtistId   String
  artistName        String?
  likedTrackCount   Int      @default(0)
  active            Boolean  @default(false)
  firstObservedAt   DateTime @default(now())
  lastChangedAt     DateTime
  createdAt         DateTime @default(now())
  updatedAt         DateTime @updatedAt

  user User @relation(fields: [userId], references: [id], onDelete: Cascade)

  @@unique([userId, spotifyArtistId])
  @@index([userId, active, likedTrackCount])
}

'''
          text = text.replace(anchor, liked + anchor, 1)
          path.write_text(text)
          PY
      - name: Commit schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "feat: wire LIKED-01 Gate 2 Prisma schema"
          git push origin HEAD:feat/liked-01-gate2
