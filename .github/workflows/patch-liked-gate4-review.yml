name: Patch LIKED-01 Gate 4 review findings

on:
  push:
    branches:
      - fix/liked-01-gate4-review
    paths:
      - ".github/workflows/patch-liked-gate4-review.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/liked-01-gate4-review
          fetch-depth: 0
      - name: Apply review fixes and regression tests
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one marker in {path}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          for_you = "src/services/music-discovery/for-you-report.ts"
          replace_once(
              for_you,
              '''export type ForYouReportOptions = {\n  limitPerCategory?: number;\n};''',
              '''export type ForYouReportOptions = {\n  limitPerCategory?: number;\n  /**\n   * Keeps provider acquisition/evaluation budgets anchored to the product baseline\n   * while allowing a deeper output pool for read-only shadow diagnostics.\n   * Defaults to limitPerCategory, preserving every existing caller.\n   */\n  externalReferenceLimit?: number;\n};''',
          )
          replace_once(
              for_you,
              '''  const limitPerCategory = boundedLimit(\n    options.limitPerCategory ?? DEFAULT_LIMIT_PER_CATEGORY,\n  );\n\n  const [profile, trackIdentities] = await Promise.all([''',
              '''  const limitPerCategory = boundedLimit(\n    options.limitPerCategory ?? DEFAULT_LIMIT_PER_CATEGORY,\n  );\n  const externalReferenceLimit = boundedLimit(\n    options.externalReferenceLimit ?? limitPerCategory,\n  );\n\n  const [profile, trackIdentities] = await Promise.all([''',
          )
          replace_once(
              for_you,
              '''  const external = await buildExternalRecommendations({\n    userId,\n    scoring,\n    limit: limitPerCategory,\n  });''',
              '''  const external = await buildExternalRecommendations({\n    userId,\n    scoring,\n    limit: limitPerCategory,\n    referenceLimit: externalReferenceLimit,\n  });''',
          )
          replace_once(
              for_you,
              '''async function buildExternalRecommendations(input: {\n  userId: string;\n  scoring: ReturnType<typeof buildDiscoveryGate22ScoringReport>;\n  limit: number;\n}): Promise<{''',
              '''export function getForYouExternalDiscoveryLimits(\n  outputLimit: number,\n  referenceLimit: number = outputLimit,\n): { maxCandidates: number; evaluationTopN: number } {\n  boundedLimit(outputLimit);\n  const reference = boundedLimit(referenceLimit);\n  return {\n    maxCandidates: Math.max(reference * 12, 48),\n    evaluationTopN: Math.max(reference * 4, 16),\n  };\n}\n\nasync function buildExternalRecommendations(input: {\n  userId: string;\n  scoring: ReturnType<typeof buildDiscoveryGate22ScoringReport>;\n  limit: number;\n  referenceLimit: number;\n}): Promise<{''',
          )
          replace_once(
              for_you,
              '''    const acquisition = await acquireLastFmExternalDiscovery({\n      provider: new LastFmSimilarityClient({ apiKey }),\n      artistSeeds,\n      trackSeeds,\n      perSeed: EXTERNAL_PER_SEED,\n      maxCandidates: Math.max(input.limit * 12, 48),\n    });\n\n    const history = await getKnownHistory(input.userId, acquisition.candidates);\n    const evaluation = evaluateExternalDiscoveryCandidates({\n      candidates: acquisition.candidates,\n      historyEvidence: (candidate) => historyEvidenceFor(candidate, history),\n      topN: Math.max(input.limit * 4, 16),\n    });''',
              '''    const externalLimits = getForYouExternalDiscoveryLimits(\n      input.limit,\n      input.referenceLimit,\n    );\n    const acquisition = await acquireLastFmExternalDiscovery({\n      provider: new LastFmSimilarityClient({ apiKey }),\n      artistSeeds,\n      trackSeeds,\n      perSeed: EXTERNAL_PER_SEED,\n      maxCandidates: externalLimits.maxCandidates,\n    });\n\n    const history = await getKnownHistory(input.userId, acquisition.candidates);\n    const evaluation = evaluateExternalDiscoveryCandidates({\n      candidates: acquisition.candidates,\n      historyEvidence: (candidate) => historyEvidenceFor(candidate, history),\n      topN: externalLimits.evaluationTopN,\n    });''',
          )

          liked = "src/services/music-preference/liked-shadow-discovery.ts"
          replace_once(
              liked,
              '''export type LikedShadowRankedRecommendation = ForYouRecommendation & {\n  baselineRank: number;\n  shadowRank: number;\n  baselineScore: number;\n  shadowScore: number;\n  boost: number;''',
              '''export type LikedShadowRankedRecommendation = ForYouRecommendation & {\n  baselineRank: number;\n  shadowRank: number;\n  baselineScore: number;\n  shadowScore: number;\n  shadowRankingScore: number;\n  boost: number;''',
          )
          replace_once(
              liked,
              '''type EnrichedRecommendation = {\n  recommendation: ForYouRecommendation;\n  baselineRank: number;\n  shadowScore: number;\n  boost: number;''',
              '''type EnrichedRecommendation = {\n  recommendation: ForYouRecommendation;\n  baselineRank: number;\n  shadowScore: number;\n  shadowRankingScore: number;\n  boost: number;''',
          )
          replace_once(
              liked,
              '''  const baseline = await getForYouReport(userId, { limitPerCategory: poolPerCategory });''',
              '''  const baseline = await getForYouReport(userId, {\n    limitPerCategory: poolPerCategory,\n    // The product UI renders top 4. A deeper shadow output pool must not change\n    // Last.fm acquisition/evaluation budgets, otherwise its baseline stops being\n    // comparable with the UI baseline.\n    externalReferenceLimit: LIKED_SHADOW_DISCOVERY_POLICY.topPerCategory,\n  });''',
          )
          replace_once(
              liked,
              '''  const rankedShadow = [...enriched].sort((left, right) => {\n    if (left.shadowScore !== right.shadowScore) return right.shadowScore - left.shadowScore;''',
              '''  const rankedShadow = [...enriched].sort((left, right) => {\n    if (left.shadowRankingScore !== right.shadowRankingScore) {\n      return right.shadowRankingScore - left.shadowRankingScore;\n    }''',
          )
          replace_once(
              liked,
              '''    shadowScore: rounded(Math.min(100, recommendation.score + boost), 3),\n    boost,''',
              '''    shadowScore: rounded(Math.min(100, recommendation.score + boost), 3),\n    shadowRankingScore: rounded(recommendation.score + boost, 3),\n    boost,''',
          )
          replace_once(
              liked,
              '''    shadowScore: row.shadowScore,\n    boost: row.boost,''',
              '''    shadowScore: row.shadowScore,\n    shadowRankingScore: row.shadowRankingScore,\n    boost: row.boost,''',
          )

          for_you_test = "src/services/music-discovery/for-you-report.test.ts"
          replace_once(
              for_you_test,
              '''  dedupeForYouRecommendations,\n  forYouReasonTexts,''',
              '''  dedupeForYouRecommendations,\n  getForYouExternalDiscoveryLimits,\n  forYouReasonTexts,''',
          )
          p = Path(for_you_test)
          t = p.read_text()
          block = '''\n\ntest("external discovery budgets can stay UI-equivalent while shadow output pool grows", () => {\n  const ui = getForYouExternalDiscoveryLimits(4, 4);\n  const shadowPool = getForYouExternalDiscoveryLimits(12, 4);\n\n  assert.deepEqual(shadowPool, ui);\n  assert.deepEqual(ui, { maxCandidates: 48, evaluationTopN: 16 });\n});\n'''
          if block.strip() not in t:
              p.write_text(t + block)

          p = Path("src/services/music-preference/liked-shadow-discovery.test.ts")
          t = p.read_text()
          block = '''\n\ntest("uncapped shadow ranking preserves affinity above the display score ceiling", () => {\n  const report = buildLikedShadowDiscoveryComparison({\n    baseline: baseline({\n      discovery: [\n        recommendation("d1", "DESCOBERTA", "Baseline 100", 100),\n        recommendation("d2", "DESCOBERTA", "Liked 99", 99),\n      ],\n    }),\n    directAffinities: [\n      { spotifyArtistId: "liked-99", artistName: "Liked 99", likedTrackCount: 64 },\n    ],\n    similarityEdges: [],\n    activeSeedCount: 0,\n    poolPerCategory: 2,\n    topPerCategory: 2,\n  });\n\n  assert.deepEqual(\n    report.categories.discovery.shadow.map((row) => row.artistName),\n    ["Liked 99", "Baseline 100"],\n  );\n  const liked = report.categories.discovery.shadow[0]!;\n  assert.equal(liked.shadowScore, 100);\n  assert.equal(liked.shadowRankingScore, 111);\n  assert.equal(liked.boost, 12);\n});\n'''
          if block.strip() not in t:
              p.write_text(t + block)

      - name: Commit fixes
        run: |
          git config user.name "Marcos Nascimento"
          git config user.email "nascimento@itscontrol.com.br"
          git add src/services/music-discovery/for-you-report.ts \
                  src/services/music-discovery/for-you-report.test.ts \
                  src/services/music-preference/liked-shadow-discovery.ts \
                  src/services/music-preference/liked-shadow-discovery.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: address LIKED-01 Gate 4 review findings"
          git push origin HEAD:fix/liked-01-gate4-review
