name: PODCAST-04 address review

on:
  push:
    branches:
      - agent/podcast-04-listening-state
    paths:
      - .github/workflows/podcast-04-address-review.yml

permissions:
  contents: write

jobs:
  address-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/podcast-04-listening-state
          fetch-depth: 0

      - name: Apply deterministic review fixes
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          def decode(value: str) -> str:
              return base64.b64decode(value).decode()

          state_path = Path("src/services/spotify/podcast-listening-state.ts")
          state = state_path.read_text()
          old_state = decode("")
          new_state = decode("")
          if state.count(old_state) != 1:
              raise SystemExit("podcast state replacement anchor not found exactly once")
          state_path.write_text(state.replace(old_state, new_state))

          reader_path = Path("src/services/spotify/incremental-reader.ts")
          reader = reader_path.read_text()
          old_reader = decode("")
          new_reader = decode("")
          if reader.count(old_reader) != 1:
              raise SystemExit("replay duration replacement anchor not found exactly once")
          reader_path.write_text(reader.replace(old_reader, new_reader))

          Path("src/services/spotify/podcast-replay-policy.test.ts").write_text(
              decode("")
          )
          Path("src/services/spotify/podcast-listening-state.integration.test.ts").write_text(
              decode("")
          )
          PY

      - name: Verify patch shape
        run: |
          git diff --check
          git diff -- src/services/spotify/podcast-listening-state.ts src/services/spotify/incremental-reader.ts src/services/spotify/podcast-replay-policy.test.ts src/services/spotify/podcast-listening-state.integration.test.ts

      - name: Commit review fixes
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "noreply@openai.com"
          git add src/services/spotify/podcast-listening-state.ts \
                  src/services/spotify/incremental-reader.ts \
                  src/services/spotify/podcast-replay-policy.test.ts \
                  src/services/spotify/podcast-listening-state.integration.test.ts
          git commit -m "fix: address PODCAST-04 review findings"
          git push origin HEAD:agent/podcast-04-listening-state
