name: MUSIC-IDENTITY-01 Gate 4E0 validation

on:
  pull_request:
    paths:
      - "prisma/music-identity-activation.prisma"
      - "prisma/migrations/20260924223000_music_identity_gate4e0_activation_projection/**"
      - "src/services/music-identity/canonical-dedupe-activation-projection.ts"
      - "src/services/music-identity/canonical-dedupe-activation-projection.test.ts"
      - "src/services/music-identity/canonical-dedupe-activation-projection.integration.test.ts"
      - "src/services/music-identity/canonical-representative-selection-shadow.ts"
      - "src/services/spotify/catalog-read-session.ts"
      - "src/services/spotify/catalog-read-session.test.ts"
      - "src/services/spotify/catalog-search.ts"
      - "src/services/spotify/catalog-search.track-lookup.test.ts"
      - "scripts/report-music-identity-representative-selection-shadow.ts"
      - "scripts/report-music-identity-dedupe-activation-projection.ts"
      - "docs/MUSIC-IDENTITY-01-GATE4E0-ACTIVATION-PROJECTION.md"
      - ".github/workflows/music-identity-01-gate4e0-validation.yml"
  push:
    branches:
      - main
    paths:
      - "prisma/music-identity-activation.prisma"
      - "prisma/migrations/20260924223000_music_identity_gate4e0_activation_projection/**"
      - "src/services/music-identity/canonical-dedupe-activation-projection.ts"
      - "src/services/music-identity/canonical-dedupe-activation-projection.test.ts"
      - "src/services/music-identity/canonical-dedupe-activation-projection.integration.test.ts"
      - "src/services/music-identity/canonical-representative-selection-shadow.ts"
      - "src/services/spotify/catalog-read-session.ts"
      - "src/services/spotify/catalog-read-session.test.ts"
      - "src/services/spotify/catalog-search.ts"
      - "src/services/spotify/catalog-search.track-lookup.test.ts"
      - "scripts/report-music-identity-representative-selection-shadow.ts"
      - "scripts/report-music-identity-dedupe-activation-projection.ts"
      - "docs/MUSIC-IDENTITY-01-GATE4E0-ACTIVATION-PROJECTION.md"
      - ".github/workflows/music-identity-01-gate4e0-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_music_identity_gate4e0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_music_identity_gate4e0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_music_identity_gate4e0?schema=public
      MUSIC_IDENTITY_DB_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: MUSIC-IDENTITY-01 Gate 4E0 activation projection contracts
        run: >-
          npx tsx --test
          src/services/music-identity/canonical-dedupe-activation-projection.test.ts
          src/services/music-identity/canonical-dedupe-activation-projection.integration.test.ts
          src/services/music-identity/canonical-representative-selection-shadow.test.ts
          src/services/music-identity/canonical-representative-selection-shadow.integration.test.ts
          src/services/spotify/catalog-read-session.test.ts
          src/services/spotify/catalog-search.track-lookup.test.ts
      - run: npm run typecheck
      - run: npm run build
