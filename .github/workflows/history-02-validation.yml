name: HISTORY-02 validation

on:
  push:
    branches:
      - "agent/history-02-extended-dry-run"
    paths:
      - "src/services/spotify-extended-history/**"
      - "scripts/import-spotify-extended-history.ts"
      - "package.json"
      - ".github/workflows/history-02-validation.yml"
  pull_request:
    paths:
      - "src/services/spotify-extended-history/**"
      - "scripts/import-spotify-extended-history.ts"
      - "package.json"
      - ".github/workflows/history-02-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm

      - run: npm ci
      - run: npm run test:spotify-history
      - run: npm run test:history
      - run: npm run test:lastfm
      - run: npm run typecheck
      - run: npm run build
