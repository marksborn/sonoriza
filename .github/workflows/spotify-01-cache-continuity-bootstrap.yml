name: SPOTIFY-01 resumable cache gate

on:
  push:
    branches:
      - agent/spotify-01-cache-continuity

permissions:
  contents: write

jobs:
  implement-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sonoriza_test?schema=public
      AUTH_SECRET: spotify-01-resumable-cache-ci-secret
      AUTH_GOOGLE_ID: ci-google
      AUTH_GOOGLE_SECRET: ci-google-secret
      AUTH_SPOTIFY_ID: ci-spotify
      AUTH_SPOTIFY_SECRET: ci-spotify-secret
      CRON_SECRET: ci-cron-secret

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spotify-01-cache-continuity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Implement resumable playlist cache and low-call cleanup gate
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          # ---------------------------------------------------------------
          # Cache payload: keep v3 as the only complete cache. v4 is an
          # explicitly incomplete checkpoint that full-cache consumers must
          # never mistake for a complete source.
          # ---------------------------------------------------------------
          path = Path('src/services/spotify/source-cache.ts')
          text = path.read_text()
          if 'PARTIAL_MUSIC_SOURCE_CACHE_VERSION' not in text:
              text = replace_once(
                  text,
                  'const MUSIC_SOURCE_CACHE_VERSION = 3;\n',
                  'const MUSIC_SOURCE_CACHE_VERSION = 3;\nconst PARTIAL_MUSIC_SOURCE_CACHE_VERSION = 4;\n',
                  'partial cache version',
              )
              marker = 'export function patchMusicSourceCacheAfterAppend(\n'
              helpers = '''export type PartialMusicSourceCache = {\n  candidates: Candidate[];\n  unavailableTrackCount: number;\n  nextOffset: number | null;\n};\n\nexport function encodePartialMusicSourceCache(\n  candidates: Candidate[],\n  unavailableTrackCount: number,\n  nextOffset: number | null,\n) {\n  const full = encodeMusicSourceCache(candidates, unavailableTrackCount);\n  return {\n    version: PARTIAL_MUSIC_SOURCE_CACHE_VERSION,\n    complete: false as const,\n    unavailableTrackCount: full.unavailableTrackCount,\n    nextOffset,\n    candidates: full.candidates,\n  };\n}\n\nexport function decodePartialMusicSourceCache(\n  value: unknown,\n): PartialMusicSourceCache | null {\n  if (!value || typeof value !== "object" || Array.isArray(value)) return null;\n  const payload = value as {\n    version?: unknown;\n    complete?: unknown;\n    unavailableTrackCount?: unknown;\n    nextOffset?: unknown;\n    candidates?: unknown;\n  };\n  if (\n    payload.version !== PARTIAL_MUSIC_SOURCE_CACHE_VERSION ||\n    payload.complete !== false ||\n    (payload.nextOffset !== null &&\n      (!Number.isInteger(payload.nextOffset) || Number(payload.nextOffset) < 0))\n  ) {\n    return null;\n  }\n\n  const decoded = decodePayload({\n    version: MUSIC_SOURCE_CACHE_VERSION,\n    unavailableTrackCount: payload.unavailableTrackCount,\n    candidates: payload.candidates,\n  });\n  if (!decoded) return null;\n  return {\n    candidates: decoded.candidates,\n    unavailableTrackCount: decoded.unavailableTrackCount,\n    nextOffset: payload.nextOffset as number | null,\n  };\n}\n\n'''
              text = replace_once(text, marker, helpers + marker, 'partial cache helpers')
              path.write_text(text)

          path = Path('src/services/spotify/source-cache.test.ts')
          text = path.read_text()
          if 'partial cache checkpoints are resumable' not in text:
              text = replace_once(
                  text,
                  '  decodeMusicSourceCacheUnavailableTrackCount,\n  encodeMusicSourceCache,\n',
                  '  decodeMusicSourceCacheUnavailableTrackCount,\n  decodePartialMusicSourceCache,\n  encodeMusicSourceCache,\n  encodePartialMusicSourceCache,\n',
                  'partial cache test imports',
              )
              text += '''\n\ntest("partial cache checkpoints are resumable but never decode as a complete cache", () => {\n  const partial = encodePartialMusicSourceCache(candidates, 4, 100);\n  assert.equal(decodeMusicSourceCache(partial), null);\n  assert.deepEqual(decodePartialMusicSourceCache(partial), {\n    candidates,\n    unavailableTrackCount: 4,\n    nextOffset: 100,\n  });\n});\n\ntest("partial cache may checkpoint all item pages while waiting for final snapshot validation", () => {\n  const partial = encodePartialMusicSourceCache(candidates, 1, null);\n  const decoded = decodePartialMusicSourceCache(partial);\n  assert.ok(decoded);\n  assert.equal(decoded.nextOffset, null);\n  assert.equal(decodeMusicSourceCache(partial), null);\n});\n'''
              path.write_text(text)

          # ---------------------------------------------------------------
          # Incremental MUSIC reader: persist each successful page as a v4
          # checkpoint, resume by offset when snapshot_id is unchanged, and
          # only promote to v3 after the playlist snapshot is proven stable.
          # ---------------------------------------------------------------
          path = Path('src/services/spotify/incremental-reader.ts')
          text = path.read_text()
          text = replace_once(
              text,
              '''  decodeMusicSourceCache,\n  decodeMusicSourceCacheUnavailableTrackCount,\n  encodeMusicSourceCache,\n''',
              '''  decodeMusicSourceCache,\n  decodeMusicSourceCacheUnavailableTrackCount,\n  decodePartialMusicSourceCache,\n  encodeMusicSourceCache,\n  encodePartialMusicSourceCache,\n''',
              'incremental partial imports',
          ) if 'decodePartialMusicSourceCache' not in text else text

          start = text.index('  private createMusicPlaylistSource(\n')
          end = text.index('  private createPodcastPlaylistSource(\n', start)
          replacement = '''  private createMusicPlaylistSource(\n    source: IncrementalSpotifySourceConfig,\n  ): SpotifyIncrementalCandidateSource {\n    const sourceKey = `PLAYLIST:${source.spotifyId}`;\n    const metrics = this.sourceMetrics(sourceKey);\n    let initialized = false;\n    let snapshotBefore: string | null = null;\n    let persistedSnapshotId: string | null = source.spotifySnapshotId;\n    let nextUrl: string | null = null;\n    let done = false;\n    let cached: Candidate[] | null = null;\n    let cacheDelivered = false;\n    let partialCached: Candidate[] | null = null;\n    let partialCacheDelivered = false;\n    let cachedUnavailableTrackCount = 0;\n    let accumulatedUnavailableTrackCount = 0;\n    const accumulated: Candidate[] = [];\n\n    const itemsPath = (offset: number): string =>\n      `/playlists/${source.spotifyId}/items?market=from_token&limit=50${\n        offset > 0 ? `&offset=${offset}` : ""\n      }&fields=next,items(item(uri,name,duration_ms,is_local,type,is_playable,restrictions(reason),artists(name)))`;\n\n    const nextOffsetFrom = (next: string | null): number | null => {\n      if (!next) return null;\n      try {\n        const value = Number(new URL(next, API).searchParams.get("offset"));\n        return Number.isInteger(value) && value >= 0 ? value : null;\n      } catch {\n        return null;\n      }\n    };\n\n    const persistCache = async (\n      snapshotId: string,\n      payload: Prisma.InputJsonValue,\n    ): Promise<void> => {\n      try {\n        const result = await prisma.sourcePlaylist.updateMany({\n          where: { id: source.id, spotifySnapshotId: persistedSnapshotId },\n          data: {\n            spotifySnapshotId: snapshotId,\n            cachedCandidates: payload,\n            cacheUpdatedAt: new Date(),\n          },\n        });\n        if (result.count !== 1) {\n          metrics.cacheWriteFailures += 1;\n          return;\n        }\n        persistedSnapshotId = snapshotId;\n        metrics.cacheWrites += 1;\n      } catch {\n        metrics.cacheWriteFailures += 1;\n      }\n    };\n\n    return {\n      id: source.id,\n      label: source.name ?? "Playlist de músicas",\n      kind: "MUSIC",\n      spotifyType: source.spotifyType,\n      spotifyId: source.spotifyId,\n      get done() {\n        return done;\n      },\n      readNext: async (): Promise<IncrementalSourceBatch> => {\n        if (done) return { candidates: [], done: true, fromCache: cached !== null };\n\n        if (!initialized) {\n          initialized = true;\n          snapshotBefore = await this.getPlaylistSnapshotId(source.spotifyId);\n          const snapshotMatches = source.spotifySnapshotId === snapshotBefore;\n          cached = snapshotMatches\n            ? decodeMusicSourceCache(source.cachedCandidates)\n            : null;\n          cachedUnavailableTrackCount = snapshotMatches\n            ? decodeMusicSourceCacheUnavailableTrackCount(source.cachedCandidates) ?? 0\n            : 0;\n          const partial =\n            snapshotMatches && cached === null\n              ? decodePartialMusicSourceCache(source.cachedCandidates)\n              : null;\n\n          if (cached !== null) {\n            this.requestMetrics.cacheHits += 1;\n            metrics.cacheHits += 1;\n            metrics.snapshotUnchanged += 1;\n          } else if (partial !== null) {\n            this.requestMetrics.cacheHits += 1;\n            metrics.cacheHits += 1;\n            metrics.snapshotUnchanged += 1;\n            partialCached = partial.candidates;\n            cachedUnavailableTrackCount = partial.unavailableTrackCount;\n            accumulated.push(...partial.candidates);\n            accumulatedUnavailableTrackCount = partial.unavailableTrackCount;\n\n            if (partial.nextOffset === null) {\n              // Every item page was already collected before an earlier run\n              // lost the final validation call. The metadata read above proves\n              // the same snapshot is still current, so promotion is safe.\n              await persistCache(\n                snapshotBefore,\n                encodeMusicSourceCache(\n                  accumulated,\n                  accumulatedUnavailableTrackCount,\n                ) as Prisma.InputJsonValue,\n              );\n              cached = accumulated.slice();\n              partialCached = null;\n            } else {\n              nextUrl = itemsPath(partial.nextOffset);\n            }\n          } else {\n            this.requestMetrics.cacheMisses += 1;\n            metrics.cacheMisses += 1;\n            if (source.spotifySnapshotId) {\n              if (snapshotMatches) metrics.snapshotUnchanged += 1;\n              else metrics.snapshotChanged += 1;\n            }\n            nextUrl = itemsPath(0);\n          }\n        }\n\n        if (cached !== null) {\n          if (cacheDelivered) return { candidates: [], done: true, fromCache: true };\n          cacheDelivered = true;\n          done = true;\n          return {\n            candidates: cached,\n            done: true,\n            fromCache: true,\n            unavailableMusicSkippedCount: cachedUnavailableTrackCount,\n          };\n        }\n\n        if (partialCached !== null && !partialCacheDelivered) {\n          partialCacheDelivered = true;\n          return {\n            candidates: partialCached,\n            done: false,\n            fromCache: true,\n            unavailableMusicSkippedCount: cachedUnavailableTrackCount,\n          };\n        }\n\n        if (!nextUrl || !snapshotBefore) {\n          done = true;\n          return { candidates: [], done: true };\n        }\n\n        const page: SpotifyPage<PlaylistItem> = await this.request(nextUrl);\n        metrics.pagesRead += 1;\n        const candidates: Candidate[] = [];\n        let unavailableMusicSkippedCount = 0;\n        for (const item of page.items) {\n          const result = readPlayableMusicCandidate(item.item);\n          if (result.unavailable) unavailableMusicSkippedCount += 1;\n          if (result.candidate) candidates.push(result.candidate);\n        }\n        accumulatedUnavailableTrackCount += unavailableMusicSkippedCount;\n        accumulated.push(...candidates);\n\n        const providerNext = page.next;\n        const nextOffset = nextOffsetFrom(providerNext);\n        nextUrl = providerNext ? stripBase(providerNext) : null;\n        done = nextUrl === null;\n\n        if (!providerNext || nextOffset !== null) {\n          await persistCache(\n            snapshotBefore,\n            encodePartialMusicSourceCache(\n              accumulated,\n              accumulatedUnavailableTrackCount,\n              nextOffset,\n            ) as Prisma.InputJsonValue,\n          );\n        }\n\n        if (done) {\n          const snapshotAfter = await this.getPlaylistSnapshotId(source.spotifyId);\n          if (snapshotAfter !== snapshotBefore) {\n            throw new Error(\n              `Spotify playlist ${source.spotifyId} changed while its items were being read; collection marked incomplete`,\n            );\n          }\n\n          await persistCache(\n            snapshotAfter,\n            encodeMusicSourceCache(\n              accumulated,\n              accumulatedUnavailableTrackCount,\n            ) as Prisma.InputJsonValue,\n          );\n        }\n\n        return { candidates, done, unavailableMusicSkippedCount };\n      },\n    };\n  }\n\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          # ---------------------------------------------------------------
          # Regression: a quota failure after page 1 leaves a resumable DB
          # checkpoint. The next run with the same snapshot begins at offset
          # 50 and promotes the checkpoint to a complete v3 cache.
          # ---------------------------------------------------------------
          path = Path('src/services/spotify/incremental-reader.test.ts')
          text = path.read_text()
          if 'quota checkpoint resumes from the next music page' not in text:
              text = replace_once(
                  text,
                  'import { SpotifyApiError } from "./errors";\n',
                  'import { SpotifyApiError } from "./errors";\nimport {\n  decodeMusicSourceCache,\n  decodePartialMusicSourceCache,\n  encodePartialMusicSourceCache,\n} from "./source-cache";\n',
                  'incremental test cache imports',
              )
              text += '''\n\nintegrationTest(\n  "quota checkpoint resumes from the next music page instead of restarting a large playlist",\n  async (t) => {\n    const suffix = `${Date.now()}-${Math.random().toString(16).slice(2)}`;\n    const user = await prisma.user.create({\n      data: { email: `incremental-resume-${suffix}@example.test` },\n    });\n    const dbSource = await prisma.sourcePlaylist.create({\n      data: {\n        userId: user.id,\n        kind: "MUSIC",\n        spotifyType: "PLAYLIST",\n        spotifyId: "playlist-resume",\n        name: "Resume playlist",\n      },\n    });\n    t.after(async () => {\n      await prisma.user.delete({ where: { id: user.id } });\n    });\n\n    const originalFetch = globalThis.fetch;\n    const urls: string[] = [];\n    let mode: "quota" | "resume" = "quota";\n\n    globalThis.fetch = (async (input) => {\n      const url = String(input);\n      urls.push(url);\n      if (url.includes("/playlists/playlist-resume?fields=snapshot_id")) {\n        return jsonResponse({ snapshot_id: "resume-snapshot" });\n      }\n      if (url.includes("/playlists/playlist-resume/items?")) {\n        if (mode === "quota") {\n          if (url.includes("offset=50")) {\n            return jsonResponse(\n              { error: { status: 429, message: "Too many requests", reason: "QUOTA_EXCEEDED" } },\n              { status: 429 },\n            );\n          }\n          return jsonResponse({\n            items: [{ item: { uri: "spotify:track:first", name: "First", duration_ms: 180_000, is_local: false, type: "track", artists: [{ name: "Artist" }] } }],\n            next: "https://api.spotify.com/v1/playlists/playlist-resume/items?offset=50&limit=50",\n          });\n        }\n        assert.match(url, /offset=50/);\n        return jsonResponse({\n          items: [{ item: { uri: "spotify:track:second", name: "Second", duration_ms: 180_000, is_local: false, type: "track", artists: [{ name: "Artist" }] } }],\n          next: null,\n        });\n      }\n      throw new Error(`Unexpected Spotify request: ${url}`);\n    }) as typeof fetch;\n\n    try {\n      const firstConfig = await prisma.sourcePlaylist.findUniqueOrThrow({ where: { id: dbSource.id } });\n      const firstReader = createReader();\n      const firstCursor = await firstReader.createSource(firstConfig);\n      const firstBatch = await firstCursor.readNext();\n      assert.deepEqual(firstBatch.candidates.map((item) => item.uri), ["spotify:track:first"]);\n      await assert.rejects(firstCursor.readNext(), (error: unknown) => {\n        assert.ok(error instanceof SpotifyApiError);\n        assert.equal(error.kind, "QUOTA_EXCEEDED");\n        return true;\n      });\n\n      const checkpoint = await prisma.sourcePlaylist.findUniqueOrThrow({ where: { id: dbSource.id } });\n      assert.equal(checkpoint.spotifySnapshotId, "resume-snapshot");\n      const partial = decodePartialMusicSourceCache(checkpoint.cachedCandidates);\n      assert.ok(partial);\n      assert.equal(partial.nextOffset, 50);\n      assert.deepEqual(partial.candidates.map((item) => item.uri), ["spotify:track:first"]);\n      assert.equal(decodeMusicSourceCache(checkpoint.cachedCandidates), null);\n\n      mode = "resume";\n      urls.length = 0;\n      const secondReader = createReader();\n      const secondCursor = await secondReader.createSource(checkpoint);\n      const cachedBatch = await secondCursor.readNext();\n      assert.equal(cachedBatch.fromCache, true);\n      assert.equal(cachedBatch.done, false);\n      assert.deepEqual(cachedBatch.candidates.map((item) => item.uri), ["spotify:track:first"]);\n      const resumedBatch = await secondCursor.readNext();\n      assert.equal(resumedBatch.done, true);\n      assert.deepEqual(resumedBatch.candidates.map((item) => item.uri), ["spotify:track:second"]);\n      const itemUrls = urls.filter((url) => url.includes("/items?"));\n      assert.equal(itemUrls.length, 1);\n      assert.match(itemUrls[0]!, /offset=50/);\n\n      const complete = await prisma.sourcePlaylist.findUniqueOrThrow({ where: { id: dbSource.id } });\n      assert.deepEqual(\n        decodeMusicSourceCache(complete.cachedCandidates)?.map((item) => item.uri),\n        ["spotify:track:first", "spotify:track:second"],\n      );\n      assert.equal(decodePartialMusicSourceCache(complete.cachedCandidates), null);\n    } finally {\n      globalThis.fetch = originalFetch;\n    }\n  },\n);\n\ntest("changed playlist snapshot discards a partial checkpoint and restarts from page zero", async () => {\n  const originalFetch = globalThis.fetch;\n  const urls: string[] = [];\n  globalThis.fetch = (async (input) => {\n    const url = String(input);\n    urls.push(url);\n    if (url.includes("?fields=snapshot_id")) return jsonResponse({ snapshot_id: "new-snapshot" });\n    if (url.includes("/items?")) return jsonResponse({ items: [], next: null });\n    throw new Error(`Unexpected Spotify request: ${url}`);\n  }) as typeof fetch;\n\n  try {\n    const partial = encodePartialMusicSourceCache(\n      [{ uri: "spotify:track:old", spotifyTrackId: "old", type: "MUSIC", title: "Old", durationMs: 1 }],\n      0,\n      50,\n    );\n    const reader = createReader();\n    const cursor = await reader.createSource(\n      source({\n        kind: "MUSIC",\n        spotifyType: "PLAYLIST",\n        name: "Music source",\n        spotifySnapshotId: "old-snapshot",\n        cachedCandidates: partial,\n      }),\n    );\n    await cursor.readNext();\n    const itemsUrl = urls.find((url) => url.includes("/items?")) ?? "";\n    assert.doesNotMatch(itemsUrl, /offset=50/);\n  } finally {\n    globalThis.fetch = originalFetch;\n  }\n});\n'''
              path.write_text(text)

          # ---------------------------------------------------------------
          # MUSIC-02 daily scheduler: if no complete cache exists, return
          # before any Spotify history call. If the remote snapshot drifted,
          # spend only the one metadata validation call before deferring.
          # ---------------------------------------------------------------
          path = Path('src/services/spotify/source-cleanup.ts')
          text = path.read_text()
          old = '''  const history = await syncRecentlyPlayed(userId, now);\n  if (!history.enabled) {\n    throw new MusicSourceCleanupHistoryRequiredError(\n      "O histórico nativo precisa permanecer ativo para executar a limpeza.",\n    );\n  }\n\n  const cachedCandidates = decodeMusicSourceCache(source.cachedCandidates);\n  if (!source.spotifySnapshotId || !cachedCandidates) {\n    throw new MusicSourceCleanupError(\n      "A limpeza automática foi adiada porque a fonte ainda não possui um cache Spotify completo e validado. Uma simulação conclusiva pode reconstruí-lo sem permitir uma varredura destrutiva por quota.",\n    );\n  }\n\n  const accessToken = await getSpotifyAccessToken(userId);\n  const [me, metadata, playedStates] = await Promise.all([\n    spotifyRequest<{ id?: string | null }>(accessToken, "/me"),\n    readPlaylistMetadata(accessToken, source.spotifyId),\n    prisma.trackListeningState.findMany({\n      where: { userId },\n      select: { spotifyTrackId: true },\n    }),\n  ]);\n\n  if (!metadata.snapshot_id || metadata.snapshot_id !== source.spotifySnapshotId) {\n    throw new MusicSourceCleanupStaleError(\n      "A limpeza automática foi adiada porque a playlist mudou fora do cache conhecido. O Sonoriza não fará uma varredura integral só para a rotina periódica.",\n    );\n  }\n  const ownerId = metadata.owner?.id ?? null;\n  if (ownerId !== me.id && metadata.collaborative !== true) {\n    throw new MusicSourceCleanupPermissionError(\n      "A conta conectada não é proprietária nem colaboradora desta playlist.",\n    );\n  }\n\n'''
          new = '''  const cachedCandidates = decodeMusicSourceCache(source.cachedCandidates);\n  if (!source.spotifySnapshotId || !cachedCandidates) {\n    throw new MusicSourceCleanupError(\n      "A limpeza automática foi adiada porque a fonte ainda não possui um cache Spotify completo e validado. Uma simulação conclusiva pode reconstruí-lo sem permitir uma varredura destrutiva por quota.",\n    );\n  }\n\n  const accessToken = await getSpotifyAccessToken(userId);\n  const metadata = await readPlaylistMetadata(accessToken, source.spotifyId);\n  if (!metadata.snapshot_id || metadata.snapshot_id !== source.spotifySnapshotId) {\n    throw new MusicSourceCleanupStaleError(\n      "A limpeza automática foi adiada porque a playlist mudou fora do cache conhecido. O Sonoriza não fará uma varredura integral só para a rotina periódica.",\n    );\n  }\n\n  const history = await syncRecentlyPlayed(userId, now);\n  if (!history.enabled) {\n    throw new MusicSourceCleanupHistoryRequiredError(\n      "O histórico nativo precisa permanecer ativo para executar a limpeza.",\n    );\n  }\n\n  const me = await spotifyRequest<{ id?: string | null }>(accessToken, "/me");\n  const ownerId = metadata.owner?.id ?? null;\n  if (ownerId !== me.id && metadata.collaborative !== true) {\n    throw new MusicSourceCleanupPermissionError(\n      "A conta conectada não é proprietária nem colaboradora desta playlist.",\n    );\n  }\n\n  const playedStates = await prisma.trackListeningState.findMany({\n    where: { userId },\n    select: { spotifyTrackId: true },\n  });\n\n'''
          if old not in text:
              raise SystemExit('automatic cleanup ordering block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('src/services/spotify/source-cleanup.test.ts')
          text = path.read_text()
          if 'periodic cleanup rejects missing cache before Spotify history traffic' not in text:
              text += '''\n\ntest("periodic cleanup rejects missing cache before Spotify history traffic", () => {\n  const source = readFileSync("src/services/spotify/source-cleanup.ts", "utf8");\n  const start = source.indexOf("export async function executeAutomaticMusicSourceCleanup");\n  const end = source.indexOf("\\nasync function loadManagedMusicSource", start);\n  assert.ok(start >= 0 && end > start);\n  const automatic = source.slice(start, end);\n  assert.ok(automatic.indexOf("decodeMusicSourceCache") < automatic.indexOf("syncRecentlyPlayed"));\n  assert.ok(automatic.indexOf("readPlaylistMetadata") < automatic.indexOf("syncRecentlyPlayed"));\n});\n'''
              path.write_text(text)
          PY

      - run: npm ci
      - run: npx prisma validate
      - run: npm run db:deploy
      - run: npm run db:generate
      - run: npm run test:planner
      - run: npm run test:spotify
      - run: npm run test:incremental
      - run: npm run test:simulation
      - run: npm run typecheck
      - run: npm run build

      - name: Commit certified implementation
        run: |
          git config user.name "Marcos Nascimento"
          git config user.email "nascimento@itscontrol.com.br"
          git add src/services/spotify/source-cache.ts \
                  src/services/spotify/source-cache.test.ts \
                  src/services/spotify/incremental-reader.ts \
                  src/services/spotify/incremental-reader.test.ts \
                  src/services/spotify/source-cleanup.ts \
                  src/services/spotify/source-cleanup.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix: resume Spotify playlist reads after quota checkpoints"
            git push origin HEAD:agent/spotify-01-cache-continuity
          fi