name: PODCAST-06 validation

on:
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "prisma/podcast-show-cadence-policy.prisma"
      - "prisma/migrations/**"
      - "scripts/report-podcast-show-cadence-gate2.ts"
      - "src/app/dashboard/configuracao/fontes/podcasts/**"
      - "src/jobs/generate-playlists.ts"
      - "src/services/configuration-readiness.ts"
      - "src/services/configuration-readiness-podcast06.test.ts"
      - "src/services/playlist-planner/plan-run.ts"
      - "src/services/playlist-planner/podcast-cadence-shadow-runtime.ts"
      - "src/services/playlist-planner/podcast-cadence-shadow-runtime.test.ts"
      - "src/services/spotify/podcast-listening-state.ts"
      - "src/services/spotify/podcast-listening-state.test.ts"
      - "src/services/spotify/podcast-listening-state.integration.test.ts"
      - "src/services/spotify/podcast-show-cadence-contract.ts"
      - "src/services/spotify/podcast-show-cadence-contract.test.ts"
      - "src/services/spotify/podcast-show-cadence-shadow.ts"
      - "src/services/spotify/podcast-show-cadence-shadow.test.ts"
      - "src/services/spotify/podcast-show-cadence-policy-store.ts"
      - "src/services/spotify/podcast-show-policy.ts"
      - "src/services/spotify/podcast-show-policy.test.ts"
      - "src/services/spotify/podcast-show-policy-v2.test.ts"
      - "src/services/spotify/podcast-show-policy-store.ts"
      - "src/services/spotify/podcast-show-policy-store.integration.test.ts"
      - "src/services/spotify/podcast-show-policy-ui-podcast06.test.ts"
      - ".github/workflows/podcast-06-validation.yml"
  push:
    branches:
      - main
    paths:
      - "prisma/schema.prisma"
      - "prisma/podcast-show-cadence-policy.prisma"
      - "prisma/migrations/**"
      - "scripts/report-podcast-show-cadence-gate2.ts"
      - "src/app/dashboard/configuracao/fontes/podcasts/**"
      - "src/jobs/generate-playlists.ts"
      - "src/services/configuration-readiness.ts"
      - "src/services/configuration-readiness-podcast06.test.ts"
      - "src/services/playlist-planner/plan-run.ts"
      - "src/services/playlist-planner/podcast-cadence-shadow-runtime.ts"
      - "src/services/playlist-planner/podcast-cadence-shadow-runtime.test.ts"
      - "src/services/spotify/podcast-listening-state.ts"
      - "src/services/spotify/podcast-listening-state.test.ts"
      - "src/services/spotify/podcast-listening-state.integration.test.ts"
      - "src/services/spotify/podcast-show-cadence-contract.ts"
      - "src/services/spotify/podcast-show-cadence-contract.test.ts"
      - "src/services/spotify/podcast-show-cadence-shadow.ts"
      - "src/services/spotify/podcast-show-cadence-shadow.test.ts"
      - "src/services/spotify/podcast-show-cadence-policy-store.ts"
      - "src/services/spotify/podcast-show-policy.ts"
      - "src/services/spotify/podcast-show-policy.test.ts"
      - "src/services/spotify/podcast-show-policy-v2.test.ts"
      - "src/services/spotify/podcast-show-policy-store.ts"
      - "src/services/spotify/podcast-show-policy-store.integration.test.ts"
      - "src/services/spotify/podcast-show-policy-ui-podcast06.test.ts"
      - ".github/workflows/podcast-06-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_podcast06
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_podcast06"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_podcast06?schema=public
      NEXTAUTH_SECRET: podcast06-ci-secret
      AUTH_SECRET: podcast06-ci-secret
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
      PODCAST_06_DB_TEST: "1"
      PODCAST_LISTENING_STATE_DB_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: PODCAST-06 contract + cadence shadow + progress provenance + cross-source store + planner shadow + UI/fingerprint + PODCAST-05 regression
        run: >-
          npx tsx --test
          src/services/configuration-readiness-podcast06.test.ts
          src/services/spotify/podcast-listening-state.test.ts
          src/services/spotify/podcast-listening-state.integration.test.ts
          src/services/spotify/podcast-show-cadence-contract.test.ts
          src/services/spotify/podcast-show-cadence-shadow.test.ts
          src/services/playlist-planner/podcast-cadence-shadow-runtime.test.ts
          src/services/spotify/podcast-show-policy-store.integration.test.ts
          src/services/spotify/podcast-show-policy-ui-podcast06.test.ts
          src/services/spotify/podcast-show-policy.test.ts
          src/services/spotify/podcast-show-policy-v2.test.ts
      - run: npm run typecheck
      - run: npm run build
