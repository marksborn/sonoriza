name: Spotify reconnect action gate

on:
  push:
    branches:
      - agent/spotify-reconnect-action
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sonoriza_test?schema=public
      AUTH_SECRET: spotify-reconnect-action-ci-secret
      AUTH_GOOGLE_ID: ci-google
      AUTH_GOOGLE_SECRET: ci-google-secret
      AUTH_SPOTIFY_ID: ci-spotify
      AUTH_SPOTIFY_SECRET: ci-spotify-secret
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run db:deploy
      - run: npm run db:generate
      - run: npm run test:spotify
      - run: npm run typecheck
      - run: npm run build
