name: PRELAUNCH-01 validation

on:
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "src/app/page.tsx"
      - "src/app/api/prelaunch/**"
      - "src/components/PrelaunchSignupForm.tsx"
      - "src/services/prelaunch-**"
      - ".github/workflows/prelaunch-01-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsx --test src/services/prelaunch-signup.test.ts
      - run: npm run typecheck
      - run: npm run build
