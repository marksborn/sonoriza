name: PODCAST-07 validation

on:
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "prisma/podcast-saved-episodes-policy.prisma"
      - "prisma/migrations/**"
      - "src/services/spotify/podcast-saved-episodes-policy-store.ts"
      - "src/services/spotify/podcast-saved-episodes-policy-store.integration.test.ts"
      - "src/services/spotify/podcast-show-policy-store.ts"
      - "src/services/spotify/podcast-effective-policy-shadow.ts"
      - "src/services/spotify/podcast-effective-policy-shadow.test.ts"
      - "src/services/spotify/podcast-effective-policy-shadow.integration.test.ts"
      - ".github/workflows/podcast-07-validation.yml"
  push:
    branches:
      - main
    paths:
      - "prisma/schema.prisma"
      - "prisma/podcast-saved-episodes-policy.prisma"
      - "prisma/migrations/**"
      - "src/services/spotify/podcast-saved-episodes-policy-store.ts"
      - "src/services/spotify/podcast-saved-episodes-policy-store.integration.test.ts"
      - "src/services/spotify/podcast-show-policy-store.ts"
      - "src/services/spotify/podcast-effective-policy-shadow.ts"
      - "src/services/spotify/podcast-effective-policy-shadow.test.ts"
      - "src/services/spotify/podcast-effective-policy-shadow.integration.test.ts"
      - ".github/workflows/podcast-07-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_podcast07
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_podcast07"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_podcast07?schema=public
      NEXTAUTH_SECRET: podcast07-ci-secret
      AUTH_SECRET: podcast07-ci-secret
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
      PODCAST_07_DB_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: PODCAST-07 Gate 1 persistence + Gate 2 effective policy shadow
        run: >-
          npx tsx --test
          src/services/spotify/podcast-saved-episodes-policy-store.integration.test.ts
          src/services/spotify/podcast-effective-policy-shadow.test.ts
          src/services/spotify/podcast-effective-policy-shadow.integration.test.ts
          src/services/spotify/podcast-show-policy.test.ts
          src/services/spotify/podcast-show-policy-v2.test.ts
      - run: npm run typecheck
      - run: npm run build
