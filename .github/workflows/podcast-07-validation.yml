      - "prisma/podcast-saved-episodes-policy.prisma"
      - "prisma/migrations/**"
      - "next.config.mjs"
      - "tsconfig.json"
      - "src/app/dashboard/configuracao/fontes/podcasts/page.tsx"
      - "src/app/dashboard/configuracao/fontes/podcasts/podcast-policy-client.tsx"
      - "src/jobs/generate-playlists-podcast07.ts"
      - "src/services/calendar-event-composition-generation.ts"
      - "src/services/playlist-planner/index.ts"
      - "src/services/playlist-planner/plan-run-podcast07.ts"
