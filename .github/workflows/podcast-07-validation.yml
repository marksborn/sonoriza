      - "src/services/spotify/podcast07-playback-refresh.ts"
      - "src/services/spotify/podcast07-playback-refresh.test.ts"
      - "src/services/spotify/podcast07-playback-refresh-budget.test.ts"
      - "src/services/spotify/podcast-saved-episodes-policy-store.ts"
      - "src/services/spotify/podcast-saved-episodes-policy-store.integration.test.ts"
      - "src/services/spotify/podcast-saved-episodes-policy-history.ts"
      - "src/services/spotify/podcast-show-policy-store.ts"
      - "src/services/spotify/podcast-effective-policy-shadow.ts"
      - "src/services/spotify/podcast-effective-policy-shadow.test.ts"
      - "src/services/spotify/podcast-effective-policy-shadow.integration.test.ts"
      - "src/services/spotify/podcast-efficient-pool-shadow.ts"
      - "src/services/spotify/podcast-efficient-pool-shadow.test.ts"
      - "src/services/spotify/podcast-inherited-cadence-shadow.ts"
      - "src/services/spotify/podcast-inherited-cadence-shadow.test.ts"
      - "src/services/spotify/podcast-global-pool-cadence-shadow.ts"
      - "src/services/spotify/podcast-global-pool-cadence-shadow.test.ts"
      - "src/services/spotify/podcast-07-generation-configuration.ts"
      - "src/services/spotify/podcast-07-generation-configuration.test.ts"
      - "src/services/spotify/podcast-07-ui.test.ts"
      - "src/services/spotify/podcast-07-runtime.ts"
      - "src/services/spotify/podcast-07-runtime.test.ts"
      - "src/services/spotify/podcast-07-runtime-resolution.test.ts"
      - "src/services/spotify/podcast-07-incremental-reader.ts"
      - "src/services/spotify/podcast-07-incremental-runtime.ts"
      - "src/services/spotify/podcast-show-policy-v2.test.ts"
      - ".github/workflows/podcast-07-validation.yml"
  push:
    branches:
      - main
    paths:
      - "prisma/schema.prisma"
      - "prisma/podcast-saved-episodes-policy.prisma"
      - "prisma/migrations/**"
      - "next.config.mjs"
      - "tsconfig.json"
      - "src/app/dashboard/configuracao/fontes/podcasts/page.tsx"
      - "src/app/dashboard/configuracao/fontes/podcasts/podcast-policy-client.tsx"
      - "src/jobs/generate-playlists-podcast07.ts"
      - "src/services/calendar-event-composition-generation.ts"
      - "src/services/playlist-planner/index.ts"
      - "src/services/playlist-planner/plan-run-podcast07.ts"
      - "src/services/spotify/errors.ts"
      - "src/services/spotify/errors.operation.test.ts"
      - "src/services/spotify/podcast-authoritative-state.ts"
      - "src/services/spotify/podcast-refresh-applicability.ts"
      - "src/services/spotify/podcast-refresh-applicability.test.ts"
      - "src/services/spotify/podcast07-playback-refresh.ts"
      - "src/services/spotify/podcast07-playback-refresh.test.ts"
      - "src/services/spotify/podcast07-playback-refresh-budget.test.ts"
      - "src/services/spotify/podcast-saved-episodes-policy-store.ts"
      - "src/services/spotify/podcast-saved-episodes-policy-store.integration.test.ts"
      - "src/services/spotify/podcast-saved-episodes-policy-history.ts"
      - "src/services/spotify/podcast-show-policy-store.ts"
      - "src/services/spotify/podcast-effective-policy-shadow.ts"
      - "src/services/spotify/podcast-effective-policy-shadow.test.ts"
      - "src/services/spotify/podcast-effective-policy-shadow.integration.test.ts"
      - "src/services/spotify/podcast-efficient-pool-shadow.ts"
      - "src/services/spotify/podcast-efficient-pool-shadow.test.ts"
      - "src/services/spotify/podcast-inherited-cadence-shadow.ts"
      - "src/services/spotify/podcast-inherited-cadence-shadow.test.ts"
      - "src/services/spotify/podcast-global-pool-cadence-shadow.ts"
      - "src/services/spotify/podcast-global-pool-cadence-shadow.test.ts"
      - "src/services/spotify/podcast-07-generation-configuration.ts"
      - "src/services/spotify/podcast-07-generation-configuration.test.ts"
      - "src/services/spotify/podcast-07-ui.test.ts"
      - "src/services/spotify/podcast-07-runtime.ts"
      - "src/services/spotify/podcast-07-runtime.test.ts"
      - "src/services/spotify/podcast-07-runtime-resolution.test.ts"
      - "src/services/spotify/podcast-07-incremental-reader.ts"
      - "src/services/spotify/podcast-07-incremental-runtime.ts"
      - "src/services/spotify/podcast-show-policy-v2.test.ts"
      - ".github/workflows/podcast-07-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_podcast07
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_podcast07"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_podcast07?schema=public
      NEXTAUTH_SECRET: podcast07-ci-secret
      AUTH_SECRET: podcast07-ci-secret
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
      PODCAST_07_DB_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: PODCAST-07 Gates 1-7 validation
        run: >-
          npx tsx --test --test-concurrency=1
          src/services/spotify/errors.operation.test.ts
          src/services/spotify/podcast-refresh-applicability.test.ts
          src/services/spotify/podcast07-playback-refresh.test.ts
          src/services/spotify/podcast07-playback-refresh-budget.test.ts
          src/services/spotify/podcast-saved-episodes-policy-store.integration.test.ts
          src/services/spotify/podcast-effective-policy-shadow.test.ts
          src/services/spotify/podcast-effective-policy-shadow.integration.test.ts
          src/services/spotify/podcast-efficient-pool-shadow.test.ts
          src/services/spotify/podcast-inherited-cadence-shadow.test.ts
          src/services/spotify/podcast-global-pool-cadence-shadow.test.ts
          src/services/spotify/podcast-07-generation-configuration.test.ts
          src/services/spotify/podcast-07-ui.test.ts
          src/services/spotify/podcast-07-runtime.test.ts
          src/services/spotify/podcast-07-runtime-resolution.test.ts
          src/services/spotify/podcast-show-policy.test.ts
          src/services/spotify/podcast-show-policy-v2.test.ts
      - run: npm run typecheck
      - run: npm run build
