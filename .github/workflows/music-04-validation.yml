name: MUSIC-04 validation

on:
  push:
    branches:
      - agent/music-04-diversity-37
    paths:
      - .github/workflows/music-04-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza
      AUTH_SECRET: music-04-validation-secret
      AUTH_SPOTIFY_ID: test-spotify-id
      AUTH_SPOTIFY_SECRET: test-spotify-secret
      AUTH_GOOGLE_ID: test-google-id
      AUTH_GOOGLE_SECRET: test-google-secret
      CRON_SECRET: test-cron-secret
      SONORIZA_ALLOWED_EMAILS: test@example.com

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/music-04-diversity-37
          fetch-depth: 0

      - name: Setup Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply MUSIC-04 implementation
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          parts = [
              Path(f'.github/music04-patch/part-{index:02d}').read_text().strip()
              for index in range(1, 7)
          ]
          if parts[1].endswith('QKn'):
              parts[1] = parts[1][:-1] + 'Qn'
          encoded = ''.join(parts)
          payload = base64.b64decode(encoded, validate=True)
          expected = '7e0922f400af10bcdea4e11b2d32bff4a1a8c34060a3e93fa2f6afaeaddf2e8c'
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'patch payload SHA mismatch: {actual}')
          source = zlib.decompress(payload).decode('utf-8')
          exec(compile(source, 'music04-patch.py', 'exec'))
          PY

      - name: Align cache integration fixture with MUSIC-04 candidate shape
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/spotify/client.integration.test.ts')
          text = path.read_text()
          old = '''      title,\n      subtitle: "Artist",\n      durationMs: 180_000,'''
          new = '''      title,\n      subtitle: "Artist",\n      primaryArtistName: "Artist",\n      durationMs: 180_000,'''
          if text.count(old) != 1:
              raise SystemExit('expected cachedTrack fixture shape not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format and generate Prisma
        run: |
          npx prisma format
          npx prisma validate
          npx prisma generate

      - name: Apply migrations on disposable PostgreSQL
        run: npx prisma migrate deploy

      - name: Planner regressions
        run: npm run test:planner

      - name: Spotify regressions
        run: npm run test:spotify

      - name: Incremental and MUSIC-01 regressions
        run: npm run test:incremental

      - name: Simulation and fingerprint regressions
        run: npm run test:simulation

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma src
          git diff --cached --stat
          git commit -m "feat: MUSIC-04 — diversidade por artista e álbum (#37)"
          git push origin HEAD:agent/music-04-diversity-37
