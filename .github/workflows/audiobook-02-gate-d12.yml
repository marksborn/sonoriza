name: Audiobook Gate D.12 multi-playlist library validation

on:
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/20261018013000_audiobook_d12_global_multi_target/**"
      - "prisma/migrations/20261030140000_audiobook_d14_spotify_progress/**"
      - "scripts/report-audiobook-chapter-progress.ts"
      - "src/services/audiobooks/**"
      - "src/services/spotify/client.ts"
      - "src/jobs/generate-playlists-incremental.ts"
      - "src/app/api/audiobooks/library/**"
      - "src/app/dashboard/configuracao/audiolivros/**"
      - "src/components/AudiobookMultiPlaylistLibrary.tsx"
      - "docs/AUDIOBOOK-02-GATE-D12-MULTI-PLAYLIST.md"
      - ".github/workflows/audiobook-02-gate-d12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-library:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sonoriza_test
          POSTGRES_PASSWORD: sonoriza_test
          POSTGRES_DB: sonoriza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonoriza_test -d sonoriza_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sonoriza_test:sonoriza_test@127.0.0.1:5432/sonoriza_test
      AUDIOBOOK02_BIND_MODE: "OFF"
      AUDIOBOOK02_BIND_UI_MODE: "PREVIEW"
      AUDIOBOOK02_SELF_REPORTED_PREVIEW_MODE: "PREVIEW"
      AUDIOBOOK02_MANUAL_NOTEBOOK_MODE: "ACTIVE"
      AUDIOBOOK02_WRITE_FENCE_MODE: "ACTIVE"
      AUDIOBOOK02_SINGLE_READING_MODE: "OFF"
      AUDIOBOOK02_MULTI_TARGET_MODE: "OFF"
      AUDIOBOOK02_CHAPTER_UPDATE_MODE: "OFF"
      AUDIOBOOK02_PLANNER_MODE: "OFF"
      AUTH_SECRET: audiobook-d12-disposable-ci-only
      AUTH_GOOGLE_ID: audiobook-d12-ci
      AUTH_GOOGLE_SECRET: audiobook-d12-ci
      AUTH_SPOTIFY_ID: audiobook-d12-ci
      AUTH_SPOTIFY_SECRET: audiobook-d12-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply migrations to disposable PostgreSQL
        run: npx prisma migrate deploy
      - name: Generate Prisma client
        run: npx prisma generate
      - name: All Audiobook contract/database tests
        run: npx tsx --test src/services/audiobooks/*.test.ts
      - name: Full project typecheck
        run: npm run typecheck
      - name: Production Next.js build
        run: npm run build
