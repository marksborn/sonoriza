name: Spotify compliance Gate 6A v2

on:
  push:
    branches:
      - issue-278-gate6a-retention-contract-v2
    paths:
      - "src/services/data-policy/spotify-retention-contract*.ts"
      - "src/services/data-policy/spotify-disconnect-*.ts"
      - "src/services/data-policy/index.ts"
      - "docs/issue-278-gate6a-retention-contract-v2.md"
      - ".github/workflows/spotify-compliance-gate6a-v2.yml"
  pull_request:
    paths:
      - "src/services/data-policy/spotify-retention-contract*.ts"
      - "src/services/data-policy/spotify-disconnect-*.ts"
      - "src/services/data-policy/index.ts"
      - "docs/issue-278-gate6a-retention-contract-v2.md"
      - ".github/workflows/spotify-compliance-gate6a-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_gate6a_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_gate6a_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_gate6a_v2?schema=public
      NEXTAUTH_SECRET: gate6a-v2-ci-secret
      AUTH_SECRET: gate6a-v2-ci-secret
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
      LASTFM_API_KEY: test
      LASTFM_USERNAME: test
      MUSIC_06_LASTFM_PLANNER_ENABLED: "false"
      MUSIC_06_LASTFM_PLANNER_USER_EMAILS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: Gate 6A v2 contract + inventory
        run: >-
          npx tsx --test
          src/services/data-policy/spotify-retention-contract.test.ts
          src/services/data-policy/spotify-disconnect-prisma-inventory.integration.test.ts
      - run: npm run typecheck
      - run: npm run build
