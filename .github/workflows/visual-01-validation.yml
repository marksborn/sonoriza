name: VISUAL-01 validation

on:
  push:
    branches:
      - visual-01-design-system

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza?schema=public
      AUTH_SECRET: visual-01-ci-only-not-production
      AUTH_GOOGLE_ID: visual-01-ci
      AUTH_GOOGLE_SECRET: visual-01-ci
      AUTH_SPOTIFY_ID: visual-01-ci
      AUTH_SPOTIFY_SECRET: visual-01-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
