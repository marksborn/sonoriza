name: Patch LIKED-01 Gate 6A review guards

on:
  push:
    branches:
      - feat/liked-01-gate6a
    paths:
      - ".github/workflows/patch-liked-01-gate6a-review-runner.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/liked-01-gate6a
          fetch-depth: 0
      - name: Apply review patch
        run: python .github/patch-liked-01-gate6a-review.py
      - name: Commit patch
        run: |
          git config user.name "Marcos Nascimento"
          git config user.email "nascimento@itscontrol.com.br"
          git add src/services/music-preference/liked-discovery-expansion-shadow.ts \
                  src/services/music-preference/liked-discovery-expansion-shadow.test.ts \
                  scripts/report-liked-discovery-expansion-shadow.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden LIKED Gate 6A candidate guards"
          git push origin HEAD:feat/liked-01-gate6a
