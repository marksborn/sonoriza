name: PWA-01 icon materialize

on:
  push:
    branches:
      - agent/pwa-01-installable-app-85
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate raster install icons
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v ffmpeg >/dev/null
          mkdir -p /tmp/pwa-icons
          for size in 180 192 512; do
            mark_w=$(( size * 58 / 100 ))
            mark_h=$(( size * 64 / 100 ))
            ffmpeg -hide_banner -loglevel error -y \
              -i public/sonoriza-mark.webp \
              -vf "scale=${mark_w}:${mark_h}:force_original_aspect_ratio=decrease,pad=${size}:${size}:(ow-iw)/2:(oh-ih)/2:color=0x0B021F" \
              -frames:v 1 "/tmp/pwa-icons/pwa-icon-${size}.png"
            file "/tmp/pwa-icons/pwa-icon-${size}.png" | grep -F "PNG image data, ${size} x ${size}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-icons
          path: /tmp/pwa-icons/*.png
          if-no-files-found: error
          retention-days: 1
