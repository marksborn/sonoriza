name: MUSIC-IDENTITY-01 Gate 2C validation

on:
  pull_request:
    paths:
      - "src/services/music-identity/shadow-coverage-audit.ts"
      - "src/services/music-identity/shadow-coverage-audit.test.ts"
      - "scripts/report-music-identity-shadow-coverage.ts"
      - ".github/workflows/music-identity-01-gate2c-validation.yml"
  push:
    branches:
      - main
    paths:
      - "src/services/music-identity/shadow-coverage-audit.ts"
      - "src/services/music-identity/shadow-coverage-audit.test.ts"
      - "scripts/report-music-identity-shadow-coverage.ts"
      - ".github/workflows/music-identity-01-gate2c-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_music_identity_gate2c
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_music_identity_gate2c"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_music_identity_gate2c?schema=public
      NEXTAUTH_SECRET: music-identity-gate2c-ci-secret
      AUTH_SECRET: music-identity-gate2c-ci-secret
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: MUSIC-IDENTITY-01 Gate 2C read-only coverage contracts
        run: npx tsx --test src/services/music-identity/shadow-coverage-audit.test.ts
      - run: npm run typecheck
      - run: npm run build
