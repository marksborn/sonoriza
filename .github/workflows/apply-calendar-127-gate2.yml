name: Apply CALENDAR-127 Gate 2

on:
  push:
    branches:
      - feat/calendar-127-gate2
    paths:
      - patches/calendar-127-gate2.patch
      - .github/workflows/apply-calendar-127-gate2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calendar-127-gate2
          fetch-depth: 0
      - name: Apply source patch
        run: |
          sed -i 's/^ diff --git/diff --git/' patches/calendar-127-gate2.patch
          git apply --check patches/calendar-127-gate2.patch
          git apply patches/calendar-127-gate2.patch
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: CALENDAR #127 Gate 2 seleção por destino"
          git push origin HEAD:feat/calendar-127-gate2
