name: Patch LIKED-01 Gate 3 policy

on:
  push:
    branches:
      - feat/liked-01-gate3
    paths:
      - ".github/workflows/patch-liked-01-gate3-policy.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/liked-01-gate3
          fetch-depth: 0
      - name: Align Gate 3 conservative defaults
        shell: python
        run: |
          from pathlib import Path

          service = Path("src/services/music-preference/liked-artist-similarity.ts")
          text = service.read_text()
          old = "  sourceBudget: 20,"
          if old not in text:
              raise SystemExit("sourceBudget marker not found")
          service.write_text(text.replace(old, "  sourceBudget: 25,", 1))

          cli = Path("scripts/report-liked-artist-similarity.ts")
          text = cli.read_text()
          cli.write_text(text.replace("[--budget=20]", "[--budget=25]"))
      - name: Commit aligned Gate 3 policy
        run: |
          git config user.name "Marcos Nascimento"
          git config user.email "nascimento@itscontrol.com.br"
          git add src/services/music-preference/liked-artist-similarity.ts scripts/report-liked-artist-similarity.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore(liked): align Gate 3 conservative budget"
          git push origin HEAD:feat/liked-01-gate3
