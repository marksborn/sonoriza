name: CALENDAR-127 validation

on:
  push:
    branches:
      - "feat/calendar-127-*"
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "src/services/target-calendar-selection.ts"
      - "src/jobs/target-calendar-selection.test.ts"
      - "src/jobs/generate-playlists-incremental.ts"
      - "src/components/TargetPlaylistForm.tsx"
      - "src/app/dashboard/configuracao/destinos/page.tsx"
      - "src/services/configuration-readiness.ts"
      - ".github/workflows/calendar-127-validation.yml"
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "src/services/target-calendar-selection.ts"
      - "src/jobs/target-calendar-selection.test.ts"
      - "src/jobs/generate-playlists-incremental.ts"
      - "src/components/TargetPlaylistForm.tsx"
      - "src/app/dashboard/configuracao/destinos/page.tsx"
      - "src/services/configuration-readiness.ts"
      - ".github/workflows/calendar-127-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_calendar_127
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_calendar_127"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_calendar_127?schema=public
      NEXTAUTH_SECRET: calendar-127-secret
      AUTH_SECRET: calendar-127-secret
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run test:incremental
      - run: npm run typecheck
      - run: npm run build
