name: Patch LIKED-01 Gate 6A resolution contract

on:
  push:
    branches:
      - feat/liked-01-gate6a
    paths:
      - ".github/workflows/patch-liked-01-gate6a-contract.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/liked-01-gate6a
          fetch-depth: 0
      - name: Patch artist resolution contract
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/services/music-preference/liked-discovery-expansion-shadow.ts")
          text = path.read_text()
          old = '''      const resolution = await resolveExternalDiscoveryCandidate(spotify, {\n        candidateKey: candidate.candidateKey,\n        candidateType: "ARTIST",\n        artistName: candidate.artistName,\n      });'''
          new = '''      const resolution = await resolveExternalDiscoveryCandidate(spotify, {\n        candidateKey: candidate.candidateKey,\n        candidateType: "ARTIST",\n        artistName: candidate.artistName,\n        trackName: null,\n      });'''
          if text.count(old) != 1:
              raise SystemExit("resolution contract marker not found exactly once")
          path.write_text(text.replace(old, new, 1))
      - name: Commit patch
        run: |
          git config user.name "Marcos Nascimento"
          git config user.email "nascimento@itscontrol.com.br"
          git add src/services/music-preference/liked-discovery-expansion-shadow.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: satisfy LIKED Gate 6A resolution contract"
          git push origin HEAD:feat/liked-01-gate6a
