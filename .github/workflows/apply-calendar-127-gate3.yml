name: Apply CALENDAR-127 Gate 3

on:
  push:
    branches:
      - feat/calendar-127-gate3
    paths:
      - scripts/apply-calendar-127-gate3.py
      - .github/workflows/apply-calendar-127-gate3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calendar-127-gate3
          fetch-depth: 0
      - name: Apply deterministic Gate 3 transformations
        run: python3 scripts/apply-calendar-127-gate3.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma src
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "feat: CALENDAR #127 Gate 3 múltiplos calendários"
          git push origin HEAD:feat/calendar-127-gate3
