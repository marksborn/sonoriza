name: CONFIG-04 validation

on:
  pull_request:
    paths:
      - "src/components/ReviewSimulationButton.tsx"
      - "src/services/http-api-response.ts"
      - "src/services/http-api-response.test.ts"
      - "package.json"
      - ".github/workflows/config-04-validation.yml"
  push:
    branches:
      - main
    paths:
      - "src/components/ReviewSimulationButton.tsx"
      - "src/services/http-api-response.ts"
      - "src/services/http-api-response.test.ts"
      - "package.json"
      - ".github/workflows/config-04-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_config04
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_config04"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_config04?schema=public
      NEXTAUTH_SECRET: config04-ci-secret
      AUTH_SECRET: config04-ci-secret
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm run test:config-04
      - run: npm run typecheck
      - run: npm run build
