name: PLAYLIST-01 validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza?schema=public
      AUTH_SECRET: playlist-01-ci-only-not-production
      AUTH_GOOGLE_ID: playlist-01-ci
      AUTH_GOOGLE_SECRET: playlist-01-ci
      AUTH_SPOTIFY_ID: playlist-01-ci
      AUTH_SPOTIFY_SECRET: playlist-01-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Planner tests
        run: npm run test:planner

      - name: Spotify tests
        run: npm run test:spotify

      - name: Incremental tests
        run: npm run test:incremental

      - name: Simulation tests
        run: npm run test:simulation

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
