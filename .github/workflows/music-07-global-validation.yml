name: MUSIC-07 Global Rollout Validation

on:
  pull_request:
    paths:
      - "src/services/music-exposure/**"
      - "src/jobs/music-exposure-runtime.ts"
      - "src/jobs/music-exposure-runtime.test.ts"
      - "src/jobs/music-repeat-runtime.ts"
      - "src/jobs/incremental-planning.ts"
      - "src/jobs/incremental-planning.test.ts"
      - "src/jobs/music07-global-planner-wiring.test.ts"
      - ".env.example"
      - ".github/workflows/music-07-global-validation.yml"
  push:
    branches:
      - "feat/343-music07-global-scope-gate2"
    paths:
      - "src/services/music-exposure/**"
      - "src/jobs/music-exposure-runtime.ts"
      - "src/jobs/music-exposure-runtime.test.ts"
      - "src/jobs/music-repeat-runtime.ts"
      - "src/jobs/incremental-planning.ts"
      - "src/jobs/incremental-planning.test.ts"
      - "src/jobs/music07-global-planner-wiring.test.ts"
      - ".env.example"
      - ".github/workflows/music-07-global-validation.yml"

jobs:
  gate2:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: MUSIC-07 domain and runtime tests
        run: >-
          npx tsx --test
          src/services/music-exposure/*.test.ts
          src/jobs/music-exposure-runtime.test.ts
          src/jobs/music07-global-planner-wiring.test.ts
          src/jobs/incremental-planning.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
