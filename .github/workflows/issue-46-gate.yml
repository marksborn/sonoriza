name: Issue 46 current simulation gate

on:
  push:
    branches:
      - agent/issue-46-current-simulation-gate

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sonoriza"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza?schema=public
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: issue-46-ci-secret
      AUTH_SPOTIFY_ID: test
      AUTH_SPOTIFY_SECRET: test
      AUTH_GOOGLE_ID: test
      AUTH_GOOGLE_SECRET: test
      CRON_SECRET: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Planner tests
        run: npm run test:planner

      - name: Spotify tests
        run: npm run test:spotify

      - name: Incremental tests
        run: npm run test:incremental

      - name: Simulation and readiness tests
        run: npm run test:simulation

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
