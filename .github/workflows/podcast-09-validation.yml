name: PODCAST-09 validation

on:
  pull_request:
    paths:
      - "src/jobs/generate-playlists-podcast09.ts"
      - "src/services/playlist-planner/plan-run-podcast09.ts"
      - "src/services/playlist-planner/plan-run-podcast09.test.ts"
      - "src/services/playlist-planner/podcast-continuation-*.ts"
      - ".github/workflows/podcast-09-validation.yml"
  push:
    branches:
      - main
    paths:
      - "src/jobs/generate-playlists-podcast09.ts"
      - "src/services/playlist-planner/plan-run-podcast09.ts"
      - "src/services/playlist-planner/plan-run-podcast09.test.ts"
      - "src/services/playlist-planner/podcast-continuation-*.ts"
      - ".github/workflows/podcast-09-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_podcast09
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_podcast09"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_podcast09?schema=public
      NEXTAUTH_SECRET: podcast09-ci-secret
      AUTH_SECRET: podcast09-ci-secret
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: PODCAST-09 Gates 2-6 validation
        run: >-
          npx tsx --test
          src/services/playlist-planner/podcast-continuation-priority.test.ts
          src/services/playlist-planner/plan-run-podcast09.test.ts
          src/services/playlist-planner/podcast-continuation-gate4.test.ts
          src/services/playlist-planner/podcast-continuation-gate5.test.ts
          src/services/playlist-planner/podcast-continuation-gate6.test.ts
      - run: npm run typecheck
      - run: npm run build
