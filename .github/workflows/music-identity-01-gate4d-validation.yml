name: MUSIC-IDENTITY-01 Gate 4D validation

on:
  pull_request:
    paths:
      - "src/services/music-identity/canonical-representative-selection-shadow.ts"
      - "src/services/music-identity/canonical-representative-selection-shadow.test.ts"
      - "src/services/music-identity/canonical-representative-selection-shadow.integration.test.ts"
      - "src/services/music-identity/canonical-consumer-dedupe-shadow.ts"
      - "src/services/music-identity/canonical-component-closure-shadow.ts"
      - "src/services/music-identity/canonical-preference-shadow.ts"
      - "src/services/music-identity/shadow-resolver-report.ts"
      - "src/services/spotify/source-cache.ts"
      - "src/services/target-source-scope.ts"
      - "scripts/report-music-identity-representative-selection-shadow.ts"
      - "docs/MUSIC-IDENTITY-01-GATE4D-REPRESENTATIVE-SELECTION-SHADOW.md"
      - ".github/workflows/music-identity-01-gate4d-validation.yml"
  push:
    branches:
      - main
    paths:
      - "src/services/music-identity/canonical-representative-selection-shadow.ts"
      - "src/services/music-identity/canonical-representative-selection-shadow.test.ts"
      - "src/services/music-identity/canonical-representative-selection-shadow.integration.test.ts"
      - "src/services/music-identity/canonical-consumer-dedupe-shadow.ts"
      - "src/services/music-identity/canonical-component-closure-shadow.ts"
      - "src/services/music-identity/canonical-preference-shadow.ts"
      - "src/services/music-identity/shadow-resolver-report.ts"
      - "src/services/spotify/source-cache.ts"
      - "src/services/target-source-scope.ts"
      - "scripts/report-music-identity-representative-selection-shadow.ts"
      - "docs/MUSIC-IDENTITY-01-GATE4D-REPRESENTATIVE-SELECTION-SHADOW.md"
      - ".github/workflows/music-identity-01-gate4d-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_music_identity_gate4d
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_music_identity_gate4d"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_music_identity_gate4d?schema=public
      MUSIC_IDENTITY_DB_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: MUSIC-IDENTITY-01 Gate 4D representative selection shadow contracts
        run: >-
          npx tsx --test
          src/services/music-identity/canonical-representative-selection-shadow.test.ts
          src/services/music-identity/canonical-representative-selection-shadow.integration.test.ts
          src/services/music-identity/canonical-consumer-dedupe-shadow.test.ts
          src/services/music-identity/canonical-consumer-dedupe-shadow.integration.test.ts
          src/services/music-identity/canonical-component-closure-shadow.test.ts
          src/services/music-identity/canonical-component-closure-shadow.integration.test.ts
          src/services/music-identity/canonical-preference-shadow.test.ts
          src/services/music-identity/canonical-preference-shadow.integration.test.ts
      - run: npm run typecheck
      - run: npm run build
