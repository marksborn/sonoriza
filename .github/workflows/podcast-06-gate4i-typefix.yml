name: PODCAST-06 Gate 4I typefix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'issue-275-gate4i-canonical-show-provenance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply Candidate programId type fix and remove helper
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/services/spotify/incremental-reader.ts')
          text = path.read_text()
          before = '''            subtitle: episode.show?.name,\n            programId,\n            durationMs,'''
          after = '''            subtitle: episode.show?.name,\n            programId: programId ?? undefined,\n            durationMs,'''
          count = text.count(before)
          if count != 1:
              raise SystemExit(f'expected 1 Candidate programId match, found {count}')
          path.write_text(text.replace(before, after, 1))
          PY
          git rm .github/workflows/podcast-06-gate4i-typefix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(PODCAST-06): keep candidate programId optional'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
