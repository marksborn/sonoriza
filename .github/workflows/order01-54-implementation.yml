      - name: Format Prisma schema
        if: steps.guard.outputs.skip != 'true'
        run: npx prisma format

      - name: Generate Prisma client
        if: steps.guard.outputs.skip != 'true'
        run: npx prisma generate

      - name: Apply migrations to disposable PostgreSQL
        if: steps.guard.outputs.skip != 'true'
        run: npx prisma migrate deploy

      - name: ORDER-01 ordering regressions
        if: steps.guard.outputs.skip != 'true'
        run: npx tsx --test src/services/playlist-ordering.test.ts

      - name: Planner and configuration regressions
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          npx tsx --test src/services/playlist-planner/*.test.ts
          npx tsx --test src/services/configuration-readiness.test.ts

      - name: Typecheck
        if: steps.guard.outputs.skip != 'true'
        run: npm run typecheck

      - name: Build
        if: steps.guard.outputs.skip != 'true'
        run: npm run build

      - name: Commit validated implementation
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "Marcos Nascimento"
          git config user.email "nascimento@itscontrol.com.br"
          git add prisma src
          git diff --cached --check
          git commit -m "feat: implement ORDER-01 #54"
          git push origin HEAD:agent/order01-randomize-music-54
