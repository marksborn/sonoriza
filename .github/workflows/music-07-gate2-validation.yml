name: MUSIC-07 Gate 2 Validation

on:
  pull_request:
    paths:
      - "src/services/music-exposure/**"
      - "scripts/report-music-exposure-shadow.ts"
      - ".github/workflows/music-07-gate2-validation.yml"
  push:
    branches:
      - "issue-279-gate2-exposure-shadow"
    paths:
      - "src/services/music-exposure/**"
      - "scripts/report-music-exposure-shadow.ts"
      - ".github/workflows/music-07-gate2-validation.yml"

jobs:
  gate2:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: MUSIC-07 shadow unit tests
        run: npx tsx --test src/services/music-exposure/*.test.ts

      - name: Typecheck
        run: npm run typecheck
