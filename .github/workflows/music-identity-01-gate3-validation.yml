name: MUSIC-IDENTITY-01 Gate 3 validation

on:
  pull_request:
    paths:
      - "src/services/music-identity/shadow-resolver-report.ts"
      - "src/services/music-identity/shadow-resolver-report.test.ts"
      - "src/services/music-identity/shadow-resolver-report.integration.test.ts"
      - "src/services/music-identity/contracts.ts"
      - "src/services/music-discovery/track-version-preference.ts"
      - "src/services/spotify/source-cache.ts"
      - "src/services/target-source-scope.ts"
      - "scripts/report-music-identity-resolver-shadow.ts"
      - "package.json"
      - ".github/workflows/music-identity-01-gate3-validation.yml"
  push:
    branches:
      - main
    paths:
      - "src/services/music-identity/shadow-resolver-report.ts"
      - "src/services/music-identity/shadow-resolver-report.test.ts"
      - "src/services/music-identity/shadow-resolver-report.integration.test.ts"
      - "src/services/music-identity/contracts.ts"
      - "src/services/music-discovery/track-version-preference.ts"
      - "src/services/spotify/source-cache.ts"
      - "src/services/target-source-scope.ts"
      - "scripts/report-music-identity-resolver-shadow.ts"
      - "package.json"
      - ".github/workflows/music-identity-01-gate3-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_music_identity_gate3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_music_identity_gate3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_music_identity_gate3?schema=public
      NEXTAUTH_SECRET: music-identity-gate3-ci-secret
      AUTH_SECRET: music-identity-gate3-ci-secret
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
      MUSIC_IDENTITY_DB_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: MUSIC-IDENTITY-01 Gate 3 shadow resolver contracts
        run: >-
          npx tsx --test
          src/services/music-discovery/track-version-preference.test.ts
          src/services/music-identity/contracts.test.ts
          src/services/music-identity/contracts.integration.test.ts
          src/services/music-identity/shadow-resolver-report.test.ts
          src/services/music-identity/shadow-resolver-report.integration.test.ts
      - run: npm run typecheck
      - run: npm run build
