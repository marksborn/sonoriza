name: Apply LIKED-01 Gate 3 schema

on:
  push:
    branches:
      - feat/liked-01-gate3
    paths:
      - .github/workflows/apply-liked-01-gate3-schema.yml

permissions:
  contents: write

jobs:
  patch-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/liked-01-gate3
          fetch-depth: 0
      - name: Patch Prisma schema
        env:
          OLD_REL_B64: ICBsaWtlZFRyYWNrUHJlZmVyZW5jZXMgICAgICAgICAgICAgTGlrZWRUcmFja1ByZWZlcmVuY2VbXQogIGFydGlzdEFmZmluaXR5U3RhdGVzICAgICAgICAgICAgICBBcnRpc3RBZmZpbml0eVN0YXRlW10KICBhbGJ1bVJlY29tbWVuZGF0aW9uTWVtb3JpZXMgICAgICBBbGJ1bVJlY29tbWVuZGF0aW9uTWVtb3J5W10K
          NEW_REL_B64: 
          MARKER_B64: Ly8gLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tCi8vIE1VU0lDLTA1IOKAlCBpbmZlcnJlZCBza2lwIHByZWZlcmVuY2Ugc2lnbmFscy4K
          MODELS_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          decode = lambda name: base64.b64decode(os.environ[name]).decode()
          path = Path("prisma/schema.prisma")
          text = path.read_text()
          old_rel = decode("OLD_REL_B64")
          new_rel = decode("NEW_REL_B64")
          marker = decode("MARKER_B64")
          models = decode("MODELS_B64")

          if "artistSimilaritySeeds" not in text:
              if old_rel not in text:
                  raise SystemExit("User relation anchor not found")
              text = text.replace(old_rel, new_rel, 1)

          if "model ArtistSimilaritySeedState" not in text:
              if marker not in text:
                  raise SystemExit("MUSIC-05 anchor not found")
              text = text.replace(marker, models + marker, 1)

          path.write_text(text)
          PY
      - name: Commit schema
        run: |
          if git diff --quiet -- prisma/schema.prisma; then
            echo "Schema already patched"
            exit 0
          fi
          git config user.name "Marcos Nascimento"
          git config user.email "nascimento@itscontrol.com.br"
          git add prisma/schema.prisma
          git commit -m "feat(liked): map Gate 3 similarity schema"
          git push origin HEAD:feat/liked-01-gate3
