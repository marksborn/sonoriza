name: Patch LIKED-01 Gate 6A canonical history guard

on:
  push:
    branches:
      - feat/liked-01-gate6a
    paths:
      - ".github/workflows/patch-liked-01-gate6a-canonical-history.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/liked-01-gate6a
          fetch-depth: 0
      - name: Add resolved canonical-history guard
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one marker, got {text.count(old)}")
              return text.replace(old, new, 1)

          service = Path("src/services/music-preference/liked-discovery-expansion-shadow.ts")
          text = service.read_text()

          text = replace_once(
              text,
              '''    rejectedResolvedDirectArtists: number;\n    failures: Array<{ candidateKey: string; error: string }>;''',
              '''    rejectedResolvedDirectArtists: number;\n    rejectedResolvedHistoricalArtists: number;\n    failures: Array<{ candidateKey: string; error: string }>;''',
              "resolution metric type",
          )

          text = replace_once(
              text,
              '''  const [directAffinities, activeSeeds, similarityEdges] = await Promise.all([''',
              '''  const [\n    directAffinities,\n    activeSeeds,\n    similarityEdges,\n    historicalSpotifyArtists,\n  ] = await Promise.all([''',
              "promise destructuring",
          )

          text = replace_once(
              text,
              '''    prisma.artistSimilarityEdge.findMany({\n      where: {\n        userId,\n        provider: ArtistSimilarityProvider.LASTFM,\n        active: true,\n      },\n      select: {\n        candidateKey: true,\n        candidateArtistName: true,\n        candidateArtistMbid: true,\n        sourceSpotifyArtistId: true,\n        sourceArtistName: true,\n        similarity: true,\n      },\n    }),\n  ]);''',
              '''    prisma.artistSimilarityEdge.findMany({\n      where: {\n        userId,\n        provider: ArtistSimilarityProvider.LASTFM,\n        active: true,\n      },\n      select: {\n        candidateKey: true,\n        candidateArtistName: true,\n        candidateArtistMbid: true,\n        sourceSpotifyArtistId: true,\n        sourceArtistName: true,\n        similarity: true,\n      },\n    }),\n    prisma.trackListeningEvent.findMany({\n      where: { userId, primaryArtistId: { not: null } },\n      select: { primaryArtistId: true },\n      distinct: ["primaryArtistId"],\n    }),\n  ]);''',
              "canonical history query",
          )

          text = replace_once(
              text,
              '''  const directSpotifyArtistIds = new Set(\n    directAffinities.map((row) => row.spotifyArtistId),\n  );\n  const baselineTrackIds = new Set(''',
              '''  const directSpotifyArtistIds = new Set(\n    directAffinities.map((row) => row.spotifyArtistId),\n  );\n  const historicalSpotifyArtistIds = new Set(\n    historicalSpotifyArtists\n      .map((row) => row.primaryArtistId)\n      .filter((value): value is string => Boolean(value)),\n  );\n  const baselineTrackIds = new Set(''',
              "canonical history set",
          )

          text = replace_once(
              text,
              '''  let notFound = 0;\n  let rejectedResolvedDirectArtists = 0;''',
              '''  let notFound = 0;\n  let rejectedResolvedDirectArtists = 0;\n  let rejectedResolvedHistoricalArtists = 0;''',
              "canonical history counter",
          )

          text = replace_once(
              text,
              '''      if (\n        isResolvedDirectAffinityArtist(\n          resolution.spotifyArtist.id,\n          directSpotifyArtistIds,\n        )\n      ) {\n        rejectedResolvedDirectArtists += 1;\n        continue;\n      }\n      if (baselineTrackIds.has(resolution.spotifyTrack.id)) continue;''',
              '''      if (\n        isResolvedDirectAffinityArtist(\n          resolution.spotifyArtist.id,\n          directSpotifyArtistIds,\n        )\n      ) {\n        rejectedResolvedDirectArtists += 1;\n        continue;\n      }\n      // Last.fm names/MBIDs are pre-resolution evidence. Once Spotify gives us\n      // canonical identity, reject any artist already present in canonical\n      // listening history even if an alias or missing MBID escaped the probe.\n      if (\n        isResolvedHistoricalArtist(\n          resolution.spotifyArtist.id,\n          historicalSpotifyArtistIds,\n        )\n      ) {\n        rejectedResolvedHistoricalArtists += 1;\n        continue;\n      }\n      if (baselineTrackIds.has(resolution.spotifyTrack.id)) continue;''',
              "post-resolution canonical history guard",
          )

          text = replace_once(
              text,
              '''      notFound,\n      rejectedResolvedDirectArtists,\n      failures,''',
              '''      notFound,\n      rejectedResolvedDirectArtists,\n      rejectedResolvedHistoricalArtists,\n      failures,''',
              "return canonical history metric",
          )

          text = replace_once(
              text,
              '''export function isResolvedDirectAffinityArtist(\n  spotifyArtistId: string,\n  directSpotifyArtistIds: ReadonlySet<string>,\n): boolean {\n  return directSpotifyArtistIds.has(spotifyArtistId);\n}\n\nfunction betterSeed(''',
              '''export function isResolvedDirectAffinityArtist(\n  spotifyArtistId: string,\n  directSpotifyArtistIds: ReadonlySet<string>,\n): boolean {\n  return directSpotifyArtistIds.has(spotifyArtistId);\n}\n\nexport function isResolvedHistoricalArtist(\n  spotifyArtistId: string,\n  historicalSpotifyArtistIds: ReadonlySet<string>,\n): boolean {\n  return historicalSpotifyArtistIds.has(spotifyArtistId);\n}\n\nfunction betterSeed(''',
              "canonical history helper",
          )
          service.write_text(text)

          cli = Path("scripts/report-liked-discovery-expansion-shadow.ts")
          cli_text = cli.read_text()
          cli_text = replace_once(
              cli_text,
              '''  p(\n    "  rejected resolved direct artists:",\n    report.resolution.rejectedResolvedDirectArtists,\n  );\n  p("  provider failures:", report.resolution.failures.length);''',
              '''  p(\n    "  rejected resolved direct artists:",\n    report.resolution.rejectedResolvedDirectArtists,\n  );\n  p(\n    "  rejected resolved historical artists:",\n    report.resolution.rejectedResolvedHistoricalArtists,\n  );\n  p("  provider failures:", report.resolution.failures.length);''',
              "cli canonical history metric",
          )
          cli.write_text(cli_text)

          test_file = Path("src/services/music-preference/liked-discovery-expansion-shadow.test.ts")
          tests = test_file.read_text()
          tests = replace_once(
              tests,
              '''  isResolvedDirectAffinityArtist,\n  likedTrackCountAffinity,''',
              '''  isResolvedDirectAffinityArtist,\n  isResolvedHistoricalArtist,\n  likedTrackCountAffinity,''',
              "test helper import",
          )

          marker = '''test("expanded discovery can introduce resolved related artists without mutating current pool rows", () => {'''
          block = '''test("resolved Spotify identity cannot re-enter a historically known artist through an alias without MBID", () => {\n  const historicalIds = new Set(["spotify-known-history"]);\n  assert.equal(\n    isResolvedHistoricalArtist("spotify-known-history", historicalIds),\n    true,\n  );\n  assert.equal(isResolvedHistoricalArtist("spotify-new", historicalIds), false);\n});\n\n'''
          if tests.count(marker) != 1:
              raise SystemExit("test insertion marker not found exactly once")
          tests = tests.replace(marker, block + marker, 1)
          test_file.write_text(tests)
      - name: Commit patch
        run: |
          git config user.name "Marcos Nascimento"
          git config user.email "nascimento@itscontrol.com.br"
          git add src/services/music-preference/liked-discovery-expansion-shadow.ts \
                  src/services/music-preference/liked-discovery-expansion-shadow.test.ts \
                  scripts/report-liked-discovery-expansion-shadow.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: reject resolved artists already in canonical history"
          git push origin HEAD:feat/liked-01-gate6a
