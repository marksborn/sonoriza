name: ORDER-01 issue 54 preview fidelity

on:
  push:
    branches:
      - agent/order01-randomize-music-54

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sonoriza
          POSTGRES_PASSWORD: sonoriza
          POSTGRES_DB: sonoriza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonoriza -d sonoriza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sonoriza:sonoriza@127.0.0.1:5432/sonoriza?schema=public
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: order01-proof-secret
      AUTH_GOOGLE_ID: order01-google-id
      AUTH_GOOGLE_SECRET: order01-google-secret
      AUTH_SPOTIFY_ID: order01-spotify-id
      AUTH_SPOTIFY_SECRET: order01-spotify-secret
      CRON_SECRET: order01-cron-secret
      SONORIZA_ALLOWED_EMAILS: owner@example.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect proof commit
        id: guard
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "fix: guarantee ORDER-01 preview fidelity #54" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: npm ci

      - name: Apply preview proof hardening
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: python3 .github/scripts/order01-54-preview-proof.py

      - name: Prisma gate
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          npx prisma format
          npx prisma generate
          npx prisma migrate deploy

      - name: ORDER-01 and generation regressions
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          npx tsx --test src/services/playlist-ordering.test.ts
          npx tsx --test src/services/playlist-planner/*.test.ts
          npx tsx --test src/jobs/generate-playlists-incremental.test.ts
          npx tsx --test src/services/configuration-readiness.test.ts

      - name: Typecheck
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: npm run typecheck

      - name: Build
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: npm run build

      - name: Commit validated proof
        if: ${{ steps.guard.outputs.skip != 'true' }}
        shell: bash
        run: |
          git config user.name "Marcos Nascimento"
          git config user.email "nascimento@itscontrol.com.br"
          git add src
          git diff --cached --check
          git commit -m "fix: guarantee ORDER-01 preview fidelity #54"
          git push origin HEAD:agent/order01-randomize-music-54
