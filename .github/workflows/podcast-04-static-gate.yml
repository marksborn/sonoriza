name: PODCAST-04 static gate

on:
  push:
    branches:
      - agent/podcast-04-listening-state

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: podcast-04-test-secret
      NEXTAUTH_SECRET: podcast-04-test-secret
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
      CRON_SECRET: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sonoriza_static?schema=public
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sonoriza_static?schema=public
      - run: npm run test:planner
      - run: npm run test:spotify
      - run: npm run test:incremental
      - run: npm run test:simulation
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sonoriza_static?schema=public
