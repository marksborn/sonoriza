name: Temporary MUSIC-02 gate

on:
  push:
    branches:
      - agent/music-02-source-cleanup
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sonoriza_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_test?schema=public
      AUTH_SECRET: temporary-ci-secret-only
      AUTH_URL: http://localhost:3000
      AUTH_GOOGLE_ID: ci-google
      AUTH_GOOGLE_SECRET: ci-google-secret
      AUTH_SPOTIFY_ID: ci-spotify
      AUTH_SPOTIFY_SECRET: ci-spotify-secret
      CRON_SECRET: ci-cron

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - run: node --version
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:planner
      - run: npm run test:spotify
      - run: npm run test:incremental
      - run: npm run test:simulation
      - run: npm run typecheck
      - run: npm run build
