name: COMPOSE-01 implementation gate

on:
  push:
    branches:
      - agent/compose-01-composition-mode

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sonoriza_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sonoriza_test?schema=public
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: compose-01-validation-only-secret
      AUTH_SPOTIFY_ID: validation-only
      AUTH_SPOTIFY_SECRET: validation-only
      AUTH_GOOGLE_ID: validation-only
      AUTH_GOOGLE_SECRET: validation-only
      CRON_SECRET: validation-only

    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: agent/compose-01-composition-mode
          fetch-depth: 0

      - name: Setup Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Implement COMPOSE-01
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN="9aa1fa06504670f2d2e5d737abe12d56fc7f5a57"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN"

          mkdir -p prisma/migrations/20260808124500_composition_mode
          cat > prisma/migrations/20260808124500_composition_mode/migration.sql <<'EOF'
          CREATE TYPE "CompositionMode" AS ENUM ('PROPORTION', 'SEQUENCE');

          ALTER TABLE "TargetPlaylist"
          ADD COLUMN "compositionMode" "CompositionMode" NOT NULL DEFAULT 'PROPORTION';
          EOF

          cat > src/services/playlist-planner/types.ts <<'EOF'
          /**
           * Domain types for the playlist planner.
           *
           * The planner is deliberately decoupled from Next.js, Prisma, Spotify and
           * Google. It receives plain candidate pools and rules, and returns an ordered
           * plan. Everything else lives in the orchestration layer.
           */

          export type ContentType = "MUSIC" | "PODCAST";
          export type CompositionMode = "PROPORTION" | "SEQUENCE";
          export type SequenceStopReason =
            | "TARGET_REACHED"
            | "NO_CANDIDATE_FOR_SLOT"
            | "NO_FITTING_CANDIDATE"
            | "INVALID_PATTERN";

          export interface Candidate {
            uri: string;
            type: ContentType;
            title: string;
            subtitle?: string;
            programId?: string;
            durationMs: number;
            originalDurationMs?: number;
            resumePositionMs?: number;
            playbackPositionKnown?: boolean;
          }

          export interface PlaylistRules {
            targetDurationMs: number;
            /** Explicit composition semantics. Existing destinations migrate to PROPORTION. */
            compositionMode: CompositionMode;
            /** Active as a rule only in PROPORTION mode. */
            podcastPercent: number;
            /** Active as a rule only in SEQUENCE mode. */
            sequencePattern: ContentType[];
            maxEpisodesPerProgram: number;
            maxPodcastDurationMs?: number | null;
          }

          export interface PlannedItem extends Candidate {
            position: number;
          }

          export interface PlanResult {
            items: PlannedItem[];
            usedUris: Set<string>;
            stats: {
              compositionMode: CompositionMode;
              totalDurationMs: number;
              musicDurationMs: number;
              podcastDurationMs: number;
              musicCount: number;
              podcastCount: number;
              actualPodcastPercent: number;
              /** Retained for compatibility; active as a rule only in PROPORTION mode. */
              requestedPodcastPercent: number;
              podcastShortfallMs: number;
              musicShortfallMs: number;
              /** Retained for compatibility; zero and non-gating in SEQUENCE mode. */
              mixDeviationPoints: number;
              /** Retained alias. In SEQUENCE it mirrors sequenceQualityPassed, not a percentage gate. */
              mixQualityPassed: boolean;
              /** Canonical mode-aware composition gate. */
              compositionQualityPassed: boolean;
              unfilledSlots: number;
              poolExhausted: boolean;
              podcastIdentityMissingCount: number;
              podcastDurationExceededCount: number;
              sequenceSlotsRequested: number;
              sequenceSlotsFilled: number;
              sequenceUnfilledSlots: number;
              completedCycles: number;
              finalPartialCycleSlots: number;
              stoppedAtPatternIndex: number | null;
              sequenceQualityPassed: boolean | null;
              sequenceStopReason: SequenceStopReason | null;
            };
          }
          EOF

          cat > src/services/playlist-planner/planner.ts <<'EOF'
          import type {
            Candidate,
            ContentType,
            PlannedItem,
            PlanResult,
            PlaylistRules,
          } from "./types";

          export interface PlannerPools {
            music: Candidate[];
            podcasts: Candidate[];
          }

          export interface PlanPlaylistInput {
            rules: PlaylistRules;
            pools: PlannerPools;
            reserved?: Iterable<string>;
          }

          const MIX_QUALITY_TOLERANCE_POINTS = 10;

          export function planPlaylist({ rules, pools, reserved }: PlanPlaylistInput): PlanResult {
            const target = Math.max(0, rules.targetDurationMs);
            const podcastPercent = clamp(rules.podcastPercent, 0, 100);
            const maxPodcastDurationMs =
              rules.maxPodcastDurationMs == null
                ? null
                : Math.max(0, rules.maxPodcastDurationMs);

            const eligiblePodcasts: Candidate[] = [];
            let podcastIdentityMissingCount = 0;
            let podcastDurationExceededCount = 0;

            for (const candidate of pools.podcasts) {
              const programId = candidate.programId?.trim();
              if (!programId) {
                podcastIdentityMissingCount += 1;
                continue;
              }
              if (
                maxPodcastDurationMs !== null &&
                Math.max(0, candidate.durationMs) > maxPodcastDurationMs
              ) {
                podcastDurationExceededCount += 1;
                continue;
              }
              eligiblePodcasts.push(
                programId === candidate.programId
                  ? candidate
                  : { ...candidate, programId },
              );
            }

            const poolByType: Record<ContentType, Candidate[]> = {
              MUSIC: pools.music,
              PODCAST: eligiblePodcasts,
            };
            const used = new Set<string>(reserved ?? []);
            const newlyUsed = new Set<string>();
            const programCounts = new Map<string, number>();
            const items: PlannedItem[] = [];
            let musicDurationMs = 0;
            let podcastDurationMs = 0;

            const totalDuration = () => musicDurationMs + podcastDurationMs;
            const place = (candidate: Candidate) => {
              items.push({ ...candidate, position: items.length });
              used.add(candidate.uri);
              newlyUsed.add(candidate.uri);
              if (candidate.type === "PODCAST") {
                podcastDurationMs += Math.max(0, candidate.durationMs);
                const programId = candidate.programId!;
                programCounts.set(programId, (programCounts.get(programId) ?? 0) + 1);
              } else {
                musicDurationMs += Math.max(0, candidate.durationMs);
              }
            };

            let sequenceSlotsRequested = 0;
            let sequenceSlotsFilled = 0;
            let sequenceUnfilledSlots = 0;
            let completedCycles = 0;
            let stoppedAtPatternIndex: number | null = null;
            let sequenceQualityPassed: boolean | null = null;
            let sequenceStopReason: PlanResult["stats"]["sequenceStopReason"] = null;

            if (rules.compositionMode === "SEQUENCE") {
              const pattern = rules.sequencePattern;
              if (pattern.length === 0) {
                sequenceQualityPassed = false;
                sequenceStopReason = "INVALID_PATTERN";
              } else {
                sequenceQualityPassed = true;
                let patternIndex = 0;

                while (totalDuration() < target) {
                  const remainingMs = target - totalDuration();
                  const slotType = pattern[patternIndex]!;
                  sequenceSlotsRequested += 1;

                  const candidate = pickCandidate(
                    poolByType[slotType],
                    used,
                    programCounts,
                    rules.maxEpisodesPerProgram,
                    remainingMs,
                  );

                  if (!candidate) {
                    const sameTypeCandidateExists = Boolean(
                      pickCandidate(
                        poolByType[slotType],
                        used,
                        programCounts,
                        rules.maxEpisodesPerProgram,
                        Number.POSITIVE_INFINITY,
                      ),
                    );
                    sequenceUnfilledSlots = 1;
                    stoppedAtPatternIndex = patternIndex;
                    sequenceStopReason = sameTypeCandidateExists
                      ? "NO_FITTING_CANDIDATE"
                      : "NO_CANDIDATE_FOR_SLOT";
                    break;
                  }

                  place(candidate);
                  sequenceSlotsFilled += 1;
                  patternIndex = (patternIndex + 1) % pattern.length;
                  if (patternIndex === 0) completedCycles += 1;
                }

                if (totalDuration() >= target) sequenceStopReason = "TARGET_REACHED";
              }
            } else {
              while (totalDuration() < target) {
                const music = pickCandidate(
                  poolByType.MUSIC,
                  used,
                  programCounts,
                  rules.maxEpisodesPerProgram,
                  Number.POSITIVE_INFINITY,
                );
                const podcast = pickCandidate(
                  poolByType.PODCAST,
                  used,
                  programCounts,
                  rules.maxEpisodesPerProgram,
                  Number.POSITIVE_INFINITY,
                );
                if (!music && !podcast) break;

                place(
                  chooseProportionCandidate({
                    music,
                    podcast,
                    podcastPercent,
                    musicDurationMs,
                    podcastDurationMs,
                  }),
                );
              }
            }

            const totalDurationMs = totalDuration();
            const actualPodcastPercent =
              totalDurationMs > 0
                ? round1((podcastDurationMs / totalDurationMs) * 100)
                : target === 0
                  ? podcastPercent
                  : 0;
            const poolExhausted = totalDurationMs < target;
            const podcastBudget = (target * podcastPercent) / 100;
            const musicBudget = target - podcastBudget;

            const proportionMode = rules.compositionMode === "PROPORTION";
            const podcastShortfallMs = proportionMode
              ? Math.max(0, podcastBudget - podcastDurationMs)
              : 0;
            const musicShortfallMs = proportionMode
              ? Math.max(0, musicBudget - musicDurationMs)
              : 0;
            const mixDeviationPoints = proportionMode
              ? round1(Math.abs(actualPodcastPercent - podcastPercent))
              : 0;
            const proportionQualityPassed =
              target === 0 ||
              (!poolExhausted && mixDeviationPoints <= MIX_QUALITY_TOLERANCE_POINTS);
            const compositionQualityPassed = proportionMode
              ? proportionQualityPassed
              : sequenceQualityPassed === true;

            return {
              items,
              usedUris: newlyUsed,
              stats: {
                compositionMode: rules.compositionMode,
                totalDurationMs,
                musicDurationMs,
                podcastDurationMs,
                musicCount: items.filter((item) => item.type === "MUSIC").length,
                podcastCount: items.filter((item) => item.type === "PODCAST").length,
                actualPodcastPercent,
                requestedPodcastPercent: podcastPercent,
                podcastShortfallMs,
                musicShortfallMs,
                mixDeviationPoints,
                mixQualityPassed: compositionQualityPassed,
                compositionQualityPassed,
                unfilledSlots: sequenceUnfilledSlots,
                poolExhausted,
                podcastIdentityMissingCount,
                podcastDurationExceededCount,
                sequenceSlotsRequested,
                sequenceSlotsFilled,
                sequenceUnfilledSlots,
                completedCycles,
                finalPartialCycleSlots:
                  rules.compositionMode === "SEQUENCE" && rules.sequencePattern.length > 0
                    ? sequenceSlotsFilled % rules.sequencePattern.length
                    : 0,
                stoppedAtPatternIndex,
                sequenceQualityPassed,
                sequenceStopReason,
              },
            };
          }

          function chooseProportionCandidate(input: {
            music: Candidate | null;
            podcast: Candidate | null;
            podcastPercent: number;
            musicDurationMs: number;
            podcastDurationMs: number;
          }): Candidate {
            if (!input.music) return input.podcast!;
            if (!input.podcast) return input.music;
            if (input.podcastPercent <= 0) return input.music;
            if (input.podcastPercent >= 100) return input.podcast;

            const score = (candidate: Candidate) => {
              const podcastDuration =
                input.podcastDurationMs +
                (candidate.type === "PODCAST" ? Math.max(0, candidate.durationMs) : 0);
              const musicDuration =
                input.musicDurationMs +
                (candidate.type === "MUSIC" ? Math.max(0, candidate.durationMs) : 0);
              const total = podcastDuration + musicDuration;
              const actual = total > 0 ? (podcastDuration / total) * 100 : 0;
              return Math.abs(actual - input.podcastPercent);
            };

            const musicScore = score(input.music);
            const podcastScore = score(input.podcast);
            if (podcastScore < musicScore) return input.podcast;
            if (musicScore < podcastScore) return input.music;

            const targetRatio = input.podcastPercent / 100;
            const currentTotal = input.musicDurationMs + input.podcastDurationMs;
            const currentPodcastTarget = currentTotal * targetRatio;
            return input.podcastDurationMs < currentPodcastTarget
              ? input.podcast
              : input.music;
          }

          function pickCandidate(
            pool: Candidate[],
            used: Set<string>,
            programCounts: Map<string, number>,
            maxEpisodesPerProgram: number,
            maxDurationMs: number,
          ): Candidate | null {
            for (const candidate of pool) {
              if (used.has(candidate.uri)) continue;
              if (candidate.durationMs <= 0 || candidate.durationMs > maxDurationMs) continue;
              if (candidate.type === "PODCAST") {
                if (!candidate.programId) continue;
                const count = programCounts.get(candidate.programId) ?? 0;
                if (count >= maxEpisodesPerProgram) continue;
              }
              return candidate;
            }
            return null;
          }

          function clamp(value: number, min: number, max: number): number {
            return Math.min(max, Math.max(min, value));
          }

          function round1(value: number): number {
            return Math.round(value * 10) / 10;
          }
          EOF

          cat > src/jobs/incremental-planning.ts <<'EOF'
          import {
            planRun,
            type Candidate,
            type PlanRunResult,
            type PlannerPools,
            type RunTarget,
          } from "@/services/playlist-planner";

          export type IncrementalSourceKind = "MUSIC" | "PODCAST";

          export type IncrementalSourceBatch = {
            candidates: Candidate[];
            done: boolean;
            playbackPositionMissingCount?: number;
            fullyPlayedSkippedCount?: number;
            unavailableMusicSkippedCount?: number;
            fromCache?: boolean;
          };

          export type IncrementalCandidateSource = {
            id: string;
            label: string;
            kind: IncrementalSourceKind;
            readonly done: boolean;
            readNext(): Promise<IncrementalSourceBatch>;
          };

          export type IncrementalSourceFailure<
            TSource extends IncrementalCandidateSource = IncrementalCandidateSource,
          > = {
            source: TSource;
            error: unknown;
          };

          export type IncrementalPlanningRound = {
            round: number;
            requestedKinds: IncrementalSourceKind[];
            musicCandidates: number;
            podcastCandidates: number;
            qualityPassed: boolean;
          };

          export type IncrementalPlanningResult<
            TSource extends IncrementalCandidateSource = IncrementalCandidateSource,
          > = {
            pools: PlannerPools;
            plan: PlanRunResult;
            qualityFailures: PlanRunResult["targets"];
            readSourceIds: Set<string>;
            rounds: number;
            stoppedEarly: boolean;
            failure: IncrementalSourceFailure<TSource> | null;
          };

          type CollectIncrementallyOptions<TSource extends IncrementalCandidateSource> = {
            sources: TSource[];
            targets: RunTarget[];
            onBatch?: (source: TSource, batch: IncrementalSourceBatch) => void;
            onRound?: (round: IncrementalPlanningRound) => void;
          };

          export async function collectIncrementally<
            TSource extends IncrementalCandidateSource,
          >({ sources, targets, onBatch, onRound }: CollectIncrementallyOptions<TSource>): Promise<IncrementalPlanningResult<TSource>> {
            const pools: PlannerPools = { music: [], podcasts: [] };
            const readSourceIds = new Set<string>();
            const targetById = new Map(targets.map((target) => [target.targetPlaylistId, target]));
            const relevantKinds = sourceKindsUsedByTargets(targets);

            let requestedKinds = new Set<IncrementalSourceKind>(relevantKinds);
            let rounds = 0;
            let plan = planRun({ pools, targets });
            let qualityFailures = failedTargets(plan);
            let planningNeeds = targetsNeedingMoreCandidates(plan, targetById);

            if (planningNeeds.length === 0 && qualityFailures.length === 0) {
              return {
                pools,
                plan,
                qualityFailures,
                readSourceIds,
                rounds,
                stoppedEarly: sources.some((source) => !source.done),
                failure: null,
              };
            }

            while (requestedKinds.size > 0) {
              const readable = sources.filter(
                (source) => !source.done && requestedKinds.has(source.kind),
              );
              if (readable.length === 0) break;

              rounds += 1;
              for (const source of readable) {
                let batch: IncrementalSourceBatch;
                try {
                  batch = await source.readNext();
                } catch (error) {
                  return {
                    pools,
                    plan,
                    qualityFailures,
                    readSourceIds,
                    rounds,
                    stoppedEarly: false,
                    failure: { source, error },
                  };
                }

                readSourceIds.add(source.id);
                if (source.kind === "MUSIC") {
                  pools.music = dedupeByUri([...pools.music, ...batch.candidates]);
                } else {
                  pools.podcasts.push(...batch.candidates);
                }
                onBatch?.(source, batch);
              }

              plan = planRun({ pools, targets });
              qualityFailures = failedTargets(plan);
              planningNeeds = targetsNeedingMoreCandidates(plan, targetById);
              onRound?.({
                round: rounds,
                requestedKinds: [...requestedKinds],
                musicCandidates: pools.music.length,
                podcastCandidates: pools.podcasts.length,
                qualityPassed: qualityFailures.length === 0 && planningNeeds.length === 0,
              });

              if (qualityFailures.length === 0 && planningNeeds.length === 0) {
                return {
                  pools,
                  plan,
                  qualityFailures,
                  readSourceIds,
                  rounds,
                  stoppedEarly: sources.some((source) => !source.done),
                  failure: null,
                };
              }

              requestedKinds = inferNeededKinds(planningNeeds, targetById);
              if (requestedKinds.size === 0) {
                requestedKinds = new Set(
                  relevantKinds.filter((kind) =>
                    sources.some((source) => source.kind === kind && !source.done),
                  ),
                );
              }
            }

            return {
              pools,
              plan,
              qualityFailures,
              readSourceIds,
              rounds,
              stoppedEarly: false,
              failure: null,
            };
          }

          function failedTargets(plan: PlanRunResult): PlanRunResult["targets"] {
            return plan.targets.filter(
              (planned) => !planned.result.stats.compositionQualityPassed,
            );
          }

          function targetsNeedingMoreCandidates(
            plan: PlanRunResult,
            targetById: Map<string, RunTarget>,
          ): PlanRunResult["targets"] {
            return plan.targets.filter((planned) => {
              const target = targetById.get(planned.targetPlaylistId);
              if (!target) return false;
              const stats = planned.result.stats;
              if (!stats.compositionQualityPassed) return true;
              return (
                target.rules.compositionMode === "SEQUENCE" &&
                stats.totalDurationMs < target.rules.targetDurationMs &&
                stats.stoppedAtPatternIndex !== null
              );
            });
          }

          function sourceKindsUsedByTargets(targets: RunTarget[]): IncrementalSourceKind[] {
            let music = false;
            let podcast = false;

            for (const target of targets) {
              if (target.rules.targetDurationMs <= 0) continue;
              if (target.rules.compositionMode === "SEQUENCE") {
                music ||= target.rules.sequencePattern.includes("MUSIC");
                podcast ||= target.rules.sequencePattern.includes("PODCAST");
              } else {
                music ||= target.rules.podcastPercent < 100;
                podcast ||= target.rules.podcastPercent > 0;
              }
            }

            return [
              ...(music ? (["MUSIC"] as const) : []),
              ...(podcast ? (["PODCAST"] as const) : []),
            ];
          }

          function inferNeededKinds(
            needs: PlanRunResult["targets"],
            targetById: Map<string, RunTarget>,
          ): Set<IncrementalSourceKind> {
            const needed = new Set<IncrementalSourceKind>();

            for (const planned of needs) {
              const stats = planned.result.stats;
              const target = targetById.get(planned.targetPlaylistId);
              if (!target) continue;

              if (target.rules.compositionMode === "SEQUENCE") {
                const index = stats.stoppedAtPatternIndex;
                if (index !== null) {
                  const kind = target.rules.sequencePattern[index];
                  if (kind) needed.add(kind);
                }
                continue;
              }

              const sizeBefore = needed.size;
              if (
                stats.podcastShortfallMs > 0 ||
                stats.actualPodcastPercent < stats.requestedPodcastPercent
              ) {
                needed.add("PODCAST");
              }
              if (
                stats.musicShortfallMs > 0 ||
                stats.actualPodcastPercent > stats.requestedPodcastPercent
              ) {
                needed.add("MUSIC");
              }

              if (stats.poolExhausted && needed.size === sizeBefore) {
                if (target.rules.podcastPercent > 0) needed.add("PODCAST");
                if (target.rules.podcastPercent < 100) needed.add("MUSIC");
              }
            }

            return needed;
          }

          function dedupeByUri(candidates: Candidate[]): Candidate[] {
            const seen = new Set<string>();
            const out: Candidate[] = [];
            for (const candidate of candidates) {
              if (seen.has(candidate.uri)) continue;
              seen.add(candidate.uri);
              out.push(candidate);
            }
            return out;
          }
          EOF

          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Prisma model + safe default migration semantics.
          replace_once(
              "prisma/schema.prisma",
              "enum PodcastEpisodeMaxDurationMode {\n  NONE\n  FIXED\n  CALENDAR_MAX_EVENT\n}\n\nmodel TargetPlaylist {",
              "enum PodcastEpisodeMaxDurationMode {\n  NONE\n  FIXED\n  CALENDAR_MAX_EVENT\n}\n\nenum CompositionMode {\n  PROPORTION\n  SEQUENCE\n}\n\nmodel TargetPlaylist {",
              "schema composition enum",
          )
          replace_once(
              "prisma/schema.prisma",
              "  // Lower value is generated first and reserves its content.\n  priority                        Int                           @default(0)\n\n  durationMode",
              "  // Lower value is generated first and reserves its content.\n  priority                        Int                           @default(0)\n  // Existing destinations migrate safely to proportion semantics.\n  compositionMode                 CompositionMode               @default(PROPORTION)\n\n  durationMode",
              "schema composition field",
          )

          # CONFIG-03 form: explicit mode, inactive rule hidden from the user.
          replace_once(
              "src/components/TargetPlaylistForm.tsx",
              'type ContentType = "MUSIC" | "PODCAST";\ntype DurationMode',
              'type ContentType = "MUSIC" | "PODCAST";\ntype CompositionMode = "PROPORTION" | "SEQUENCE";\ntype DurationMode',
              "form composition type",
          )
          replace_once(
              "src/components/TargetPlaylistForm.tsx",
              "  calendarEventMarker: string;\n  podcastPercent: number;",
              "  calendarEventMarker: string;\n  compositionMode: CompositionMode;\n  podcastPercent: number;",
              "form initial composition",
          )
          replace_once(
              "src/components/TargetPlaylistForm.tsx",
              "  const [podcastPercent, setPodcastPercent] = useState(initial.podcastPercent);",
              "  const [compositionMode, setCompositionMode] = useState<CompositionMode>(\n    initial.compositionMode,\n  );\n  const [podcastPercent, setPodcastPercent] = useState(initial.podcastPercent);",
              "form composition state",
          )
          replace_once(
              "src/components/TargetPlaylistForm.tsx",
              '      <input type="hidden" name="sequencePattern" value={JSON.stringify(sequence)} />',
              '      <input type="hidden" name="sequencePattern" value={JSON.stringify(sequence)} />\n      <input type="hidden" name="podcastPercent" value={podcastPercent} />',
              "form hidden percent",
          )

          form_path = Path("src/components/TargetPlaylistForm.tsx")
          text = form_path.read_text()
          mix_start = '      <div className="rounded-2xl border border-violet-400/20 bg-violet-950/30 p-4 sm:p-5">\n        <div className="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">\n          <div>\n            <p className="text-sm font-black text-white">Mistura de conteúdo</p>'
          mix_end = '      <fieldset className="rounded-2xl border border-violet-400/20 bg-violet-950/30 p-4 sm:p-5">\n        <legend className="px-1 text-sm font-black text-white">\n          Duração máxima por episódio de podcast'
          i = text.find(mix_start)
          j = text.find(mix_end)
          if i < 0 or j < 0 or j <= i:
              raise SystemExit("form mix block markers not found")
          old_mix = text[i:j].replace('          name="podcastPercent"\n', '')
          wrapped_mix = "\n".join("  " + line if line else line for line in old_mix.rstrip().splitlines())
          chooser = '''      <fieldset>
