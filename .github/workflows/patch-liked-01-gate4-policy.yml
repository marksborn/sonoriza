name: Patch LIKED-01 Gate 4 policy typing

on:
  push:
    branches:
      - feat/liked-01-gate4
    paths:
      - ".github/workflows/patch-liked-01-gate4-policy.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/liked-01-gate4
          fetch-depth: 0
      - name: Widen configurable policy defaults
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/services/music-preference/liked-shadow-discovery.ts")
          text = path.read_text()
          marker = "  similarBoostMax: 6,\n} as const;"
          if text.count(marker) != 1:
              raise SystemExit("policy marker changed")
          path.write_text(text.replace(marker, "  similarBoostMax: 6,\n};", 1))
      - name: Commit code-only patch
        run: |
          git config user.name "Marcos Nascimento"
          git config user.email "nascimento@itscontrol.com.br"
          git add src/services/music-preference/liked-shadow-discovery.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(liked): allow configurable Gate 4 report limits"
          git push origin HEAD:feat/liked-01-gate4
