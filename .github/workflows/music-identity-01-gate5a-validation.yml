name: MUSIC-IDENTITY-01 Gate 5A Last.fm shadow

on:
  pull_request:
    paths:
      - "src/services/music-identity/canonical-factual-cooldown-shadow.ts"
      - "src/services/music-identity/canonical-factual-cooldown-shadow.test.ts"
      - "src/services/music-identity/canonical-factual-cooldown-shadow-report.ts"
      - "scripts/report-music-identity-gate5a-factual-shadow.ts"
      - "src/jobs/music-repeat-runtime.ts"
      - "src/services/music-identity/contracts.ts"
      - ".github/workflows/music-identity-01-gate5a-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Gate 5A pure safety contracts (no provider or DB)
        run: npx tsx --test src/services/music-identity/canonical-factual-cooldown-shadow.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
