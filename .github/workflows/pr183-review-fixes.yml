name: PR 183 review fixes

on:
  push:
    branches:
      - "agent/source-502-playlist-history"
    paths:
      - ".tmp/pr183-review-fixes.py"
      - ".github/workflows/pr183-review-fixes.yml"

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_pr183?schema=public
      NEXTAUTH_SECRET: pr183-review-validation
      AUTH_SECRET: pr183-review-validation
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Apply review fixes
        run: python3 .tmp/pr183-review-fixes.py

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Incremental regressions
        run: npm run test:incremental

      - name: Discovery regressions
        run: npm run test:discovery

      - name: Run diagnostic regressions
        run: npx tsx --test src/services/generation-run-diagnostics.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit validated fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .tmp/pr183-review-fixes.py .github/workflows/pr183-review-fixes.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name "Sonoriza CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet && exit 0
          git commit -m "fix: address PR 183 review findings"
          git push origin HEAD:agent/source-502-playlist-history
