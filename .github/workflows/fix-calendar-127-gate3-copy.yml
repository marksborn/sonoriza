name: Fix CALENDAR-127 Gate 3 copy

on:
  push:
    branches:
      - feat/calendar-127-gate3
    paths:
      - .github/workflows/fix-calendar-127-gate3-copy.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calendar-127-gate3
      - name: Fix plural copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/TargetPlaylistForm.tsx')
          text = path.read_text()
          old = 'Este destino usará todos os {calendarOptions.length} calendário{calendarOptions.length === 1 ? "" : "s"} atualmente consultável{calendarOptions.length === 1 ? "" : "is"}. A lista acompanha o CONFIG-01 automaticamente.'
          new = 'Este destino usará {calendarOptions.length === 1 ? "o calendário atualmente consultável" : `todos os ${calendarOptions.length} calendários atualmente consultáveis`}. A lista acompanha o CONFIG-01 automaticamente.'
          if text.count(old) != 1:
              raise SystemExit('expected copy exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit copy fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/TargetPlaylistForm.tsx
          git commit -m "fix(calendar): ajustar plural do modo todos"
          git push origin HEAD:feat/calendar-127-gate3
