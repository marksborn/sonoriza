name: PLAYBACK-RESERVE-01 validation

on:
  pull_request:
    paths:
      - "prisma/playback-reserve-policy.prisma"
      - "prisma/migrations/**"
      - "src/services/playback-reserve-policy.ts"
      - "src/services/playback-reserve-policy.test.ts"
      - "src/services/playback-reserve-policy.integration.test.ts"
      - "src/services/playback-reserve-gate2.ts"
      - "src/services/playback-reserve-gate2.test.ts"
      - "src/services/playback-reserve-shadow-runtime.ts"
      - "src/services/configuration-readiness.ts"
      - "src/services/playlist-planner/playback-reserve-duration-shadow.ts"
      - "src/services/playlist-planner/playback-reserve-duration-shadow.test.ts"
      - "src/services/playlist-planner/plan-run-playback-reserve.ts"
      - "src/services/playlist-planner/plan-run-playback-reserve.test.ts"
      - "src/services/playlist-planner/index.ts"
      - "src/jobs/generate-playlists-playback-reserve.ts"
      - "src/jobs/generate-playlists.ts"
      - ".github/workflows/playback-reserve-01-validation.yml"
  push:
    branches:
      - main
    paths:
      - "prisma/playback-reserve-policy.prisma"
      - "prisma/migrations/**"
      - "src/services/playback-reserve-policy.ts"
      - "src/services/playback-reserve-policy.test.ts"
      - "src/services/playback-reserve-policy.integration.test.ts"
      - "src/services/playback-reserve-gate2.ts"
      - "src/services/playback-reserve-gate2.test.ts"
      - "src/services/playback-reserve-shadow-runtime.ts"
      - "src/services/configuration-readiness.ts"
      - "src/services/playlist-planner/playback-reserve-duration-shadow.ts"
      - "src/services/playlist-planner/playback-reserve-duration-shadow.test.ts"
      - "src/services/playlist-planner/plan-run-playback-reserve.ts"
      - "src/services/playlist-planner/plan-run-playback-reserve.test.ts"
      - "src/services/playlist-planner/index.ts"
      - "src/jobs/generate-playlists-playback-reserve.ts"
      - "src/jobs/generate-playlists.ts"
      - ".github/workflows/playback-reserve-01-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_playback_reserve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_playback_reserve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_playback_reserve?schema=public
      NEXTAUTH_SECRET: playback-reserve-ci-secret
      AUTH_SECRET: playback-reserve-ci-secret
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
      PLAYBACK_RESERVE_DB_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: PLAYBACK-RESERVE-01 Gate 1 + Gate 2 + Gate 3 validation
        run: >-
          npx tsx --test
          src/services/playback-reserve-policy.test.ts
          src/services/playback-reserve-policy.integration.test.ts
          src/services/playback-reserve-gate2.test.ts
          src/services/playlist-planner/playback-reserve-duration-shadow.test.ts
          src/services/playlist-planner/plan-run-playback-reserve.test.ts
      - run: npm run typecheck
      - run: npm run build
