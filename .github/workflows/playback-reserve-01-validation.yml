permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_playback_reserve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_playback_reserve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_playback_reserve?schema=public
      NEXTAUTH_SECRET: playback-reserve-ci-secret
      AUTH_SECRET: playback-reserve-ci-secret
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
      PLAYBACK_RESERVE_DB_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: B1.6 operational preflight query on isolated CI database
        run: node scripts/check-playback-reserve-operational-readiness.mjs --check
      - name: PLAYBACK-RESERVE-01 Gates 1-8 validation
        run: >-
          npx tsx --test
          src/services/playback-reserve-policy.test.ts
          src/services/playback-reserve-ui.test.ts
          src/services/playback-reserve-policy.integration.test.ts
          src/services/playback-reserve-gate2.test.ts
          src/services/playback-reserve-gate6.test.ts
          src/services/playback-reserve-gate7.test.ts
          src/services/playback-reserve-gate7-persistence.test.ts
          src/services/playback-reserve-gate8.test.ts
          src/services/process-memory.test.ts
          src/services/playback-reserve-availability.test.ts
          src/services/playback-reserve-capability-simulation.test.ts
          src/services/playback-reserve-capability-simulation.integration.test.ts
          src/services/playback-reserve-product-activation.test.ts
          src/services/playback-reserve-product-activation.integration.test.ts
          src/services/playback-reserve-product-prewrite.integration.test.ts
          src/services/playlist-planner/podcast-fit.test.ts
          src/services/playlist-planner/calendar-event-composition-shadow.test.ts
          src/services/playlist-planner/playback-reserve-duration-shadow.test.ts
          src/services/playlist-planner/playback-reserve-duration-gate5.test.ts
          src/services/playlist-planner/playback-reserve-count-shadow.test.ts
          src/services/playlist-planner/plan-run-playback-reserve.test.ts
          src/services/playlist-planner/plan-run-playback-reserve-gate4.test.ts
          src/services/playlist-planner/plan-run-playback-reserve-gate7.test.ts
          src/jobs/sequence-prewrite-guard.test.ts
          src/jobs/schedule-retry-policy.test.ts
          src/jobs/scheduled-generation.test.ts
          src/jobs/spotify-preflight-telemetry.test.ts
          src/services/spotify/client-transient-read-retry.test.ts
          src/services/notifications/dispatch.test.ts
          src/services/keep-filled-calendar-scope.test.ts
          src/jobs/source-failure-policy.test.ts
          src/jobs/incremental-planning.test.ts
      - name: B1.7 isolated server-rendered Reserve consent UI contract
        run: npx tsx --test src/components/PlaybackReserveTargetConsentForm.test.tsx
      - name: B1.7 build OFFLINE styled QA preview (8 fictional states)
        run: |
          mkdir -p /tmp/sonoriza-b17-ui-preview
          npx tailwindcss -i src/app/globals.css -o /tmp/sonoriza-b17-ui-preview/app.css --minify
          npx tsx scripts/render-playback-reserve-ui-fixtures.tsx /tmp/sonoriza-b17-ui-preview
      - name: B1.7 publish offline visual review package
        uses: actions/upload-artifact@v4
        with:
          name: sonoriza-b17-ui-offline-preview
          path: /tmp/sonoriza-b17-ui-preview/
          if-no-files-found: error
          retention-days: 7
      - name: B1.5-B1.6 read-only release and operational contract tests
        run: >-
          node --test
          scripts/check-playback-reserve-release-readiness.test.mjs
          scripts/check-playback-reserve-operational-readiness.test.mjs
      - name: B1.5 dormant release CLI contract
        run: node scripts/check-playback-reserve-release-readiness.mjs --verify --expect-count=0 --expect-hash=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 --expect-runtime=UNSET
      - run: npm run typecheck
      - run: npm run build
