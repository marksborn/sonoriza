name: SPOTIFY-01 incremental validation

on:
  push:
    branches:
      - agent/spotify-01-rate-limit-quota
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sonoriza_test?schema=public
      AUTH_SECRET: spotify-01-incremental-validation-only
      NEXTAUTH_SECRET: spotify-01-incremental-validation-only
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      SPOTIFY_CLIENT_ID: validation-only
      SPOTIFY_CLIENT_SECRET: validation-only
      GOOGLE_CLIENT_ID: validation-only
      GOOGLE_CLIENT_SECRET: validation-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run db:deploy
      - run: npm run db:generate
      - run: npm run test:planner
      - run: npm run test:spotify
      - run: npm run test:incremental
      - run: npm run test:simulation
      - run: npm run typecheck
      - run: npm run build
