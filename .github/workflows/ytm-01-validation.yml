name: YTM-01 PoC contract

on:
  pull_request:
    paths:
      - 'scripts/youtube-music-poc.mjs'
      - 'scripts/youtube-music-poc.test.mjs'
      - '.github/workflows/ytm-01-validation.yml'
  push:
    branches:
      - 'spike/ytm-01-poc'
    paths:
      - 'scripts/youtube-music-poc.mjs'
      - 'scripts/youtube-music-poc.test.mjs'
      - '.github/workflows/ytm-01-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: node --check scripts/youtube-music-poc.mjs
      - name: Offline unit tests (no credentials or API calls)
        run: node --test scripts/youtube-music-poc.test.mjs
