name: UX-DEST-01 inline patch

on:
  push:
    branches:
      - ux-dest-01-211-inline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-dest-01-211-inline
          fetch-depth: 0

      - name: Move discovery into each target
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/dashboard/configuracao/destinos/page.tsx')
          text = path.read_text()

          import_anchor = '''} from "@/components/TargetPlaylistForm";\nimport { UiIcon } from "@/components/UiIcon";'''
          import_replacement = '''} from "@/components/TargetPlaylistForm";\nimport { TargetDiscoveryForm } from "@/components/TargetDiscoveryForm";\nimport { UiIcon } from "@/components/UiIcon";'''
          if import_anchor not in text:
              raise SystemExit('import anchor not found')
          text = text.replace(import_anchor, import_replacement, 1)

          local_anchor = '''} from "@/services/target-schedule";\n\nconst CONFIG_PATH = "/dashboard/configuracao/destinos";'''
          local_replacement = '''} from "@/services/target-schedule";\n\nimport { saveTargetDiscoveryPolicy } from "./discovery-actions";\n\nconst CONFIG_PATH = "/dashboard/configuracao/destinos";'''
          if local_anchor not in text:
              raise SystemExit('local import anchor not found')
          text = text.replace(local_anchor, local_replacement, 1)

          target_anchor = '''                            currentSpotifyName,\n                            destinationUnavailable,\n                          }}\n                        />\n                      </div>\n                    </details>'''
          target_replacement = '''                            currentSpotifyName,\n                            destinationUnavailable,\n                          }}\n                        />\n\n                        <div className="mt-6 border-t border-line-dark/55 pt-6">\n                          <TargetDiscoveryForm\n                            target={target}\n                            saveAction={saveTargetDiscoveryPolicy}\n                          />\n                        </div>\n                      </div>\n                    </details>'''
          if target_anchor not in text:
              raise SystemExit('target edit anchor not found')
          text = text.replace(target_anchor, target_replacement, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/dashboard/configuracao/destinos/page.tsx
          git diff --cached --check
          git commit -m "refactor(ux): colocate discovery with target config for #211"
          git push origin HEAD:ux-dest-01-211-inline
