name: Patch LIKED-01 Gate 5 diagnostics

on:
  push:
    branches:
      - feat/liked-01-gate5
    paths:
      - ".github/workflows/patch-liked-01-gate5-diagnostics.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/liked-01-gate5
          fetch-depth: 0
      - name: Patch diagnostics and regression
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one marker in {path}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1))

          service = "src/services/music-preference/liked-artist-similarity-backfill.ts"
          replace_once(
              service,
              '''  if (after.pendingSources === 0) {\n    status = "COMPLETE";\n  } else if (!status && batches.length >= maxBatches) {\n    status = "PARTIAL_MAX_BATCHES";\n  } else if (!status) {\n    status = deriveBlockedStatus(after);\n  }''',
              '''  if (after.pendingSources === 0) {\n    status = "COMPLETE";\n  } else if (!status) {\n    const blockedStatus = deriveBlockedStatus(after);\n    status =\n      blockedStatus !== "READY"\n        ? blockedStatus\n        : batches.length >= maxBatches\n          ? "PARTIAL_MAX_BATCHES"\n          : "READY";\n  }''',
          )
          replace_once(
              service,
              '''      databaseWrites:\n        input.mode === "APPLY" && input.batches.some((row) => row.selectedSources > 0),''',
              '''      // Any executed APPLY batch may reconcile seed metadata/deactivations even\n      // if a concurrent state change leaves zero selected provider sources.\n      databaseWrites: input.mode === "APPLY" && input.batches.length > 0,''',
          )

          test_file = Path("src/services/music-preference/liked-artist-similarity-backfill.test.ts")
          text = test_file.read_text()
          marker = '''test("a completed backfill is idempotent and performs zero provider calls", async () => {'''
          block = '''test("final batch reports cooldown blocker instead of masking it as max-batches exhaustion", async () => {\n  const before = snapshot({\n    successfulActiveSeeds: 922,\n    pendingSources: 10,\n    priorityReadySources: 10,\n  });\n  const after = snapshot({\n    successfulActiveSeeds: 931,\n    pendingSources: 1,\n    priorityReadySources: 0,\n    cooldownBlockedSources: 1,\n    activeSeedRows: 932,\n  });\n  let loads = 0;\n\n  const report = await runLikedArtistSimilarityBackfill(\n    "user-1",\n    { mode: "APPLY", batchBudget: 100, maxBatches: 1, batchPauseMs: 0 },\n    {\n      now: () => NOW,\n      loadSnapshot: async () => (loads++ < 2 ? before : after),\n      executeBatch: async () => ({\n        selectedSources: 10,\n        providerCalls: 10,\n        successfulSources: 9,\n        failedSources: 1,\n        beforeActiveSeeds: 922,\n        afterActiveSeeds: 932,\n        beforeActiveEdges: 9_220,\n        afterActiveEdges: 9_310,\n        failures: [],\n      }),\n      sleep: async () => undefined,\n    },\n  );\n\n  assert.equal(report.status, "BLOCKED_COOLDOWN");\n  assert.equal(report.totals.failedSources, 1);\n  assert.equal(report.safety.databaseWrites, true);\n});\n\n'''
          if block.strip() not in text:
              if marker not in text:
                  raise SystemExit("test insertion marker not found")
              test_file.write_text(text.replace(marker, block + marker, 1))
      - name: Commit patch
        run: |
          git config user.name "Marcos Nascimento"
          git config user.email "nascimento@itscontrol.com.br"
          git add src/services/music-preference/liked-artist-similarity-backfill.ts \
                  src/services/music-preference/liked-artist-similarity-backfill.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: sharpen LIKED-01 Gate 5 diagnostics"
          git push origin HEAD:feat/liked-01-gate5
