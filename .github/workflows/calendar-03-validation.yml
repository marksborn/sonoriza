name: CALENDAR-03 validation

on:
  pull_request:
    paths:
      - "prisma/calendar-event-composition-policy.prisma"
      - "prisma/migrations/**"
      - "src/app/api/generate/route.ts"
      - "src/services/calendar-event-composition-policy.ts"
      - "src/services/calendar-event-composition-policy.test.ts"
      - "src/services/calendar-event-composition-policy.integration.test.ts"
      - "src/services/calendar-event-composition-generation.ts"
      - "src/services/calendar-event-composition-generation.integration.test.ts"
      - "src/services/playlist-planner/calendar-event-composition-shadow.ts"
      - "src/services/playlist-planner/calendar-event-composition-shadow.test.ts"
      - "src/services/playlist-planner/calendar-event-composition-runtime.ts"
      - "src/services/playlist-planner/calendar-event-composition-runtime.test.ts"
      - "src/services/playlist-planner/plan-run-calendar03.ts"
      - "src/services/playlist-planner/index.ts"
      - ".github/workflows/calendar-03-validation.yml"
  push:
    branches:
      - main
    paths:
      - "prisma/calendar-event-composition-policy.prisma"
      - "prisma/migrations/**"
      - "src/app/api/generate/route.ts"
      - "src/services/calendar-event-composition-policy.ts"
      - "src/services/calendar-event-composition-policy.test.ts"
      - "src/services/calendar-event-composition-policy.integration.test.ts"
      - "src/services/calendar-event-composition-generation.ts"
      - "src/services/calendar-event-composition-generation.integration.test.ts"
      - "src/services/playlist-planner/calendar-event-composition-shadow.ts"
      - "src/services/playlist-planner/calendar-event-composition-shadow.test.ts"
      - "src/services/playlist-planner/calendar-event-composition-runtime.ts"
      - "src/services/playlist-planner/calendar-event-composition-runtime.test.ts"
      - "src/services/playlist-planner/plan-run-calendar03.ts"
      - "src/services/playlist-planner/index.ts"
      - ".github/workflows/calendar-03-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonoriza_calendar03
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonoriza_calendar03"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonoriza_calendar03?schema=public
      NEXTAUTH_SECRET: calendar03-ci-secret
      AUTH_SECRET: calendar03-ci-secret
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SPOTIFY_CLIENT_ID: test
      SPOTIFY_CLIENT_SECRET: test
      CALENDAR_03_DB_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: CALENDAR-03 Gates 1-3 validation
        run: >-
          npx tsx --test
          src/services/calendar-event-composition-policy.test.ts
          src/services/calendar-event-composition-policy.integration.test.ts
          src/services/calendar-event-composition-generation.integration.test.ts
          src/services/playlist-planner/calendar-event-composition-shadow.test.ts
          src/services/playlist-planner/calendar-event-composition-runtime.test.ts
      - run: npm run typecheck
      - run: npm run build
